name: warnings probe
on:
  push:
    branches: [claude/project-thread-xwacuf]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\warnings-probe.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.os }}
          path: probe
