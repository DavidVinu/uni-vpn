name: icon-probe
on: push
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -x
          ls -d /Applications/Xcode*.app
          xcode-select -p
          x=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1); echo "x=$x"
          export DEVELOPER_DIR="$x/Contents/Developer"
          xcrun actool --version
          ic="$x/Contents/Applications/Icon Composer.app/Contents/Executables/ictool"
          ls "$x/Contents/Applications/Icon Composer.app/Contents/Executables/" || true
          "$ic" --help || true
          mkdir -p out car
          xcrun actool app/AppIcon.icon --compile car --platform macosx --minimum-deployment-target 11.0 \
            --app-icon AppIcon --output-partial-info-plist car/partial.plist --output-format human-readable-text --warnings --errors --notices || true
          ls -l car; cat car/partial.plist || true
          xcrun assetutil --info car/Assets.car | head -150 || true
          for r in Default Dark TintedLight TintedDark ClearLight ClearDark; do
            "$ic" app/AppIcon.icon --export-preview macOS $r 512 512 1 out/$r.png || true
          done
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.runner }}
          path: |
            out
            car
