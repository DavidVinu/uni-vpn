name: CI
on:
  push:
  pull_request:
# The release number the installers and the core carry (and Settings shows).
env:
  UNI_VPN_VERSION: 0.1.${{ github.run_number }}
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Python version
        run: python3 --version
      - name: Syntax (compileall)
        run: python3 -m compileall -q uni_vpn bin/uni-vpn tests
      - name: Unit tests
        run: python3 -m unittest discover -s tests -t . -v
      - name: Shell syntax
        run: |
          # One file per call: "bash -n a b" checks only a.
          for f in install.sh get.sh packaging/macos/*.sh packaging/linux/build.sh packaging/build-core.sh; do bash -n "$f"; done
          for f in packaging/stage-app.sh packaging/uni-vpn-open packaging/macos/scripts/postinstall; do sh -n "$f"; done
      - name: Installer dry run
        run: ./install.sh --dry-run --user citest
      - name: Check launchd plist
        if: runner.os == 'macOS'
        run: |
          python3 - <<'EOF'
          from uni_vpn import service
          open("/tmp/uni-vpn.plist", "w").write(service.render_unit("/opt/homebrew/bin/python3", "/tmp/uni-vpn", "/tmp/logs", "/opt/homebrew"))
          EOF
          plutil -lint /tmp/uni-vpn.plist
      - name: Build the macOS app
        if: runner.os == 'macOS'
        run: |
          swiftc -O -o /tmp/uni-vpn-app app/macos/main.swift
          python3 -c "import plistlib; from uni_vpn import desktop; plistlib.dump(desktop.info_plist(1081), open('/tmp/Info.plist', 'wb'))"
          plutil -lint /tmp/Info.plist
      - name: Linux app syntax
        if: runner.os == 'Linux'
        run: python3 -m py_compile app/linux/uni-vpn-app.py

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax (compileall)
        run: python -m compileall -q uni_vpn bin/uni-vpn tests
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: PowerShell syntax
        shell: powershell
        run: |
          foreach ($file in "install.ps1", "get.ps1") {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | Format-List | Out-String | Write-Host; exit 1 }
          }
      - name: Installer dry run
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -DryRun -User citest
      - name: Build the Windows app
        shell: powershell
        run: |
          python -c "import pathlib, urllib.request; from uni_vpn import desktop; desktop.extract_webview2(urllib.request.urlopen(desktop.WEBVIEW2_URL).read(), pathlib.Path('build'))"
          $csc = python -c "from uni_vpn import desktop; print(desktop.csc_path())"
          & $csc /nologo /target:winexe /platform:x64 /optimize+ /win32icon:app\windows\uni-vpn.ico "/out:build\Uni VPN.exe" /lib:build /r:Microsoft.Web.WebView2.Core.dll /r:Microsoft.Web.WebView2.WinForms.dll /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Web.Extensions.dll app\windows\UniVpn.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }

  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      # LF line endings on Windows too, otherwise gofmt flags every file.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: Packet throughput of the in-process network stack
        if: runner.os == 'macOS'
        run: go test -count=1 -run TestBulkTransfer -v ./internal/netstack/
      - name: go test -race
        if: runner.os != 'Windows'
        run: go test -race ./...
      # The race detector needs cgo and a C toolchain on Windows.
      - name: go test
        if: runner.os == 'Windows'
        run: go test ./...
      - name: Contract tests against the Go core
        if: runner.os == 'Linux'
        run: |
          go build -o /tmp/uni-vpn-go ./cmd/uni-vpn
          UNI_VPN_CORE="/tmp/uni-vpn-go daemon" python3 -m unittest tests.contract.test_contract -v
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # A Python installation updates itself to the Go core the way users' copies will.
      - name: Hand-over from the Python core
        shell: bash
        run: |
          exe="$RUNNER_TEMP/uni-vpn-core"
          [ "$RUNNER_OS" = Windows ] && exe="$exe.exe"
          go build -ldflags "-X github.com/DavidVinu/uni-vpn/internal/daemon.Commit=$GITHUB_SHA" -o "$exe" ./cmd/uni-vpn
          python tests/handover_e2e.py "$exe" "$GITHUB_SHA"

  # The iPhone app's tunnel (libopenconnect, userspace network stack, SOCKS server in the
  # core's own process) built for Linux: end to end against a local ocserv, and against
  # Heidelberg's gateway with a made-up account.
  inprocess:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: libopenconnect and ocserv
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libopenconnect-dev ocserv gnutls-bin pkg-config > /dev/null
      - name: go vet with libopenconnect
        run: go vet -tags libopenconnect ./...
      - name: go test -race with libopenconnect
        run: |
          go test -race -tags libopenconnect ./...
          go test -race -tags "libopenconnect iosapi" ./cmd/uni-vpn-ios/
      - name: Heidelberg's gateway with a made-up account
        run: UNI_VPN_NET_TESTS=1 go test -tags libopenconnect -run Heidelberg -v ./internal/octunnel/
      - name: End to end against ocserv
        run: packaging/inprocess/e2e.sh

  # The sync relay (relay/): its own tests, then the Go client's tests against it.
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Relay tests
        run: node --test relay/worker.test.mjs
      - name: Go client against the relay
        run: |
          node relay/serve.mjs > "$RUNNER_TEMP/relay-url" &
          for _ in $(seq 50); do [ -s "$RUNNER_TEMP/relay-url" ] && break; sleep 0.1; done
          UNI_VPN_TEST_RELAY=$(cat "$RUNNER_TEMP/relay-url") go test -count=1 ./internal/devsync/

  # The Go core for the updaters (docs/go-switch.md), published with the installers; with the
  # app windows the installer jobs built, so that updates bring them along.
  core-files:
    needs: [go, macos-pkg, windows-installer]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: app-windows
          path: apps
      - uses: actions/download-artifact@v4
        with:
          name: app-darwin
          path: app-darwin
      - run: mkdir -p apps/darwin && tar -xzf app-darwin/app-darwin.tar.gz -C apps/darwin
      - run: packaging/build-core.sh "$GITHUB_SHA" out apps
      - uses: actions/upload-artifact@v4
        with:
          name: core-files
          path: out/*
          retention-days: 7

  # Clients update themselves from "stable" (uni_vpn/updater.py): every green commit on main
  # moves it forward. Fast-forward only, so a slower older run never moves it back.
  promote:
    needs: [tests, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: promote-stable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move stable to this commit
        run: |
          if git fetch --quiet origin stable 2>/dev/null && git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "stable is already at or past $GITHUB_SHA"
          else
            git push origin "HEAD:refs/heads/stable"
          fi

  # --- Installers: built on every push, published from main once the tests pass ------------
  # Download links: https://github.com/DavidVinu/uni-vpn/releases/latest/download/<file>

  macos-runtime:
    strategy:
      fail-fast: false
      matrix:
        # Homebrew's openconnect needs the macOS its bottle was built for, or newer.
        runner: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build openconnect and ocproxy for this processor
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: packaging/macos/build-runtime.sh runtime
      - name: Works without Homebrew's certificate file
        run: |
          arch=$(uname -m)
          # The users' Macs have no Homebrew: hide the certificate file GnuTLS was built with.
          store=$(strings runtime/$arch/lib/libgnutls*.dylib | grep -m 1 -E '^/.*/(cert|ca-bundle)\.pem$' || true)
          echo "built-in certificate file: ${store:-none}"
          if [ -n "$store" ] && [ -e "$store" ]; then sudo mv "$store" "$store.hidden"; fi
          out=$(runtime/$arch/bin/openconnect --cafile=/etc/ssl/cert.pem --non-inter --authenticate \
            --protocol=anyconnect vpn-ac.uni-heidelberg.de </dev/null 2>&1 || true)
          echo "$out" | tail -n 5
          if echo "$out" | grep -qi "certificate.*fail\|verify failed"; then exit 1; fi
          echo "$out" | grep -q "Connected to" || { echo "openconnect did not reach the gateway"; exit 1; }
      # As a tar: artifacts lose the executable flag and links otherwise.
      - run: tar -czf runtime-$(uname -m).tar.gz -C runtime .
      - uses: actions/upload-artifact@v4
        with:
          name: macos-runtime-${{ matrix.runner }}
          path: runtime-*.tar.gz
          retention-days: 3

  macos-pkg:
    needs: macos-runtime
    runs-on: macos-14
    timeout-minutes: 30
    env:
      MACOS_CERTIFICATES_P12: ${{ secrets.MACOS_CERTIFICATES_P12 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-runtime-*
          path: runtime-tar
          merge-multiple: true
      - run: mkdir runtime && for f in runtime-tar/*.tar.gz; do tar -xzf "$f" -C runtime; done && ls -l runtime/*/bin/openconnect
      # The Intel programs on the oldest macOS the .pkg installs on (distribution.xml), which this
      # runner has: dyld refuses a library built for a newer one or one that needs a symbol it lacks.
      # build-runtime.sh marks libraries Homebrew built on the newer runner for that macOS.
      - name: The Intel openconnect and ocproxy start on macOS 14
        run: |
          sw_vers -productVersion
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          test -x runtime/x86_64/bin/openconnect && test -x runtime/x86_64/bin/ocproxy
          arch -x86_64 runtime/x86_64/bin/openconnect --version
          # ocproxy has no --version; it refuses -h and stops. dyld aborts it with a signal instead.
          code=0
          out=$(arch -x86_64 runtime/x86_64/bin/ocproxy -h </dev/null 2>&1) || code=$?
          echo "$out"
          if [ "$code" -ge 128 ] || grep -q dyld <<<"$out"; then
            echo "::error::the Intel ocproxy does not start on macOS 14"
            exit 1
          fi
      # The Go core for both processors (packaging/stage-app.sh --go darwin/universal).
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Switches on by itself once the Apple Developer secrets exist (see docs/superpowers/specs).
      - name: Signing keychain
        if: env.MACOS_CERTIFICATES_P12 != ''
        env:
          MACOS_CERTIFICATES_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p ci "$keychain"
          echo "$MACOS_CERTIFICATES_P12" | base64 --decode > "$RUNNER_TEMP/certificates.p12"
          security import "$RUNNER_TEMP/certificates.p12" -k "$keychain" -P "$MACOS_CERTIFICATES_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          xcrun notarytool store-credentials uni-vpn --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --keychain "$keychain"
          {
            echo "MACOS_APP_IDENTITY=Developer ID Application"
            echo "MACOS_INSTALLER_IDENTITY=Developer ID Installer"
            echo "MACOS_NOTARY_PROFILE=uni-vpn"
          } >> "$GITHUB_ENV"
      - name: Build uni-vpn.pkg
        run: packaging/macos/build-pkg.sh runtime "$UNI_VPN_VERSION" uni-vpn.pkg app-update
      # The app window alone, for the updates (core-files). As a tar: artifacts lose the executable flag.
      - run: tar -czf app-darwin.tar.gz -C app-update .
      - uses: actions/upload-artifact@v4
        with:
          name: app-darwin
          path: app-darwin.tar.gz
          retention-days: 3
      - name: Install it like a user would
        run: |
          sudo installer -pkg uni-vpn.pkg -target / </dev/null &
          pid=$!
          for i in $(seq 240); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          if kill -0 $pid 2>/dev/null; then
            echo "The installer did not finish within 4 minutes"
            ps -axo pid,ppid,etime,command | grep -iE "uni|python|installer|launchctl|sudo|osascript|lsregister|open" | grep -v grep
            cat "$HOME/Library/Logs/uni-vpn/setup.log" || true
            sudo tail -n 40 /var/log/install.log
            exit 1
          fi
          wait $pid
          cat "$HOME/Library/Logs/uni-vpn/setup.log" || true
          for i in $(seq 30); do curl -fsS http://127.0.0.1:1081/status.json && break; sleep 1; done
          curl -fsS http://127.0.0.1:1081/status.json >/dev/null
          # The Go core of this commit answers, from the user's own copy; no Python anywhere.
          app="$HOME/Library/Application Support/uni-vpn/app"
          test "$(curl -fsS http://127.0.0.1:1081/status.json | jq -r .commit)" = "$GITHUB_SHA"
          grep -qF "$app/bin/uni-vpn-core" "$HOME/Library/LaunchAgents/de.davidvinu.uni-vpn.plist"
          lipo -archs "$app/bin/uni-vpn-core" | grep -q arm64
          lipo -archs "$app/bin/uni-vpn-core" | grep -q x86_64
          test ! -e "$app/uni_vpn"
          if find "/Applications/Uni VPN.app" "$app" -name 'python3*' | grep .; then echo "Python is in the package"; exit 1; fi
          # Setup only gets this far with openconnect and ocproxy; without Homebrew's they are the package's.
          command -v openconnect || echo "openconnect is the package's"
          grep -q "/Applications/Uni VPN.app/Contents/MacOS/Uni VPN" "$HOME/Library/LaunchAgents/de.davidvinu.uni-vpn.app.plist"
          lipo -archs "/Applications/Uni VPN.app/Contents/MacOS/Uni VPN"
          # Setup started the menu bar app; one that ends at start would reach every user with the
          # next update.
          sleep 5
          pgrep -x "Uni VPN" >/dev/null || { echo "::error::the menu bar app is not running"; exit 1; }
      - name: Uninstall it with the core
        run: |
          app="$HOME/Library/Application Support/uni-vpn/app"
          "$app/bin/uni-vpn-core" uninstall --yes || echo "note: uninstall reported a problem"
          test ! -e "$HOME/Library/LaunchAgents/de.davidvinu.uni-vpn.plist"
          test ! -e "$HOME/Library/LaunchAgents/de.davidvinu.uni-vpn.app.plist"
          # Stays after a failure (for example the proxy setting), so that uninstall can run again.
          if [ -e "$app" ]; then echo "note: $app is still there"; fi
          for i in $(seq 10); do curl -fsS http://127.0.0.1:1081/status.json >/dev/null 2>&1 || exit 0; sleep 1; done
          echo "the service still answers"; exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: uni-vpn.pkg
          retention-days: 7

  linux-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build the .deb and .rpm files (amd64 and arm64)
        run: packaging/linux/build.sh "$UNI_VPN_VERSION" out
      - name: Install the .deb like a user would
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ./out/uni-vpn.deb
          desktop-file-validate /usr/share/applications/de.davidvinu.UniVPN.desktop || true
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          for i in $(seq 20); do systemctl --user show-environment >/dev/null 2>&1 && break; sleep 1; done
          # What the app menu entry runs; no screen here, so the assistant is not opened.
          DISPLAY=:99 /usr/share/uni-vpn/uni-vpn-open || { cat ~/.local/state/uni-vpn/setup.log; exit 1; }
          cat ~/.local/state/uni-vpn/setup.log
          curl -fsS http://127.0.0.1:1081/status.json >/dev/null
          test -f ~/.local/share/uni-vpn/app/.commit
          # The Go core of this commit answers, from the user's own copy.
          test "$(curl -fsS http://127.0.0.1:1081/status.json | jq -r .commit)" = "$GITHUB_SHA"
          grep -qF "$HOME/.local/share/uni-vpn/app/bin/uni-vpn-core" ~/.config/systemd/user/uni-vpn.service
          test ! -e ~/.local/share/uni-vpn/app/uni_vpn
      - name: Uninstall it like a user would
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          ~/.local/share/uni-vpn/app/bin/uni-vpn-core uninstall --yes
          test ! -e ~/.config/systemd/user/uni-vpn.service
          test ! -e ~/.local/share/uni-vpn/app
          for i in $(seq 10); do curl -fsS http://127.0.0.1:1081/status.json >/dev/null 2>&1 || break; sleep 1; done
          if curl -fsS http://127.0.0.1:1081/status.json >/dev/null 2>&1; then echo "the service still answers"; exit 1; fi
          sudo apt-get remove -y uni-vpn
          test ! -e /usr/share/uni-vpn
      - name: Install the .rpm on Fedora
        run: |
          docker run --rm -v "$PWD/out:/out" -e GITHUB_SHA fedora:latest sh -c \
            'dnf install -y -q /out/uni-vpn.rpm && /usr/share/uni-vpn/app/bin/uni-vpn-core --version | grep -q "$GITHUB_SHA"'
      - name: The arm64 files
        run: |
          test "$(dpkg-deb -f out/uni-vpn-arm64.deb Architecture)" = arm64
          dpkg-deb -x out/uni-vpn-arm64.deb arm64
          file arm64/usr/share/uni-vpn/app/bin/uni-vpn-core | grep -q aarch64
          sudo apt-get install -y -qq qemu-user
          qemu-aarch64 arm64/usr/share/uni-vpn/app/bin/uni-vpn-core --version | grep -q "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: |
            out/uni-vpn.deb
            out/uni-vpn.rpm
            out/uni-vpn-arm64.deb
            out/uni-vpn-arm64.rpm
          retention-days: 7

  # The Android app (app/android, docs/android.md): the Go core and openconnect for phones,
  # the APK, and the phone tests on an emulator against Heidelberg's real gateway.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android NDK and SDK parts
        run: |
          # The SDK download is now and then cut off ("unknown archive"); a second try gets it.
          for attempt in 1 2 3; do
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0" > /dev/null && break
            [ "$attempt" = 3 ] && exit 1
            sleep 10
          done
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          sudo apt-get install -y -qq autoconf automake libtool pkg-config > /dev/null
      # openconnect, ocproxy and their libraries take minutes; they change only with the script.
      - uses: actions/cache@v4
        with:
          path: app/android/build/native
          key: android-native-${{ hashFiles('packaging/android/build-native.sh') }}
      - name: Upload key
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build the app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          packaging/android/build-apk.sh "$GITHUB_SHA" assembleRelease bundleRelease assembleDebug assembleDebugAndroidTest lintDebug testDebugUnitTest
          mkdir out
          outputs=app/android/app/build/outputs
          cp $outputs/apk/debug/app-debug.apk out/uni-vpn-debug.apk
          if [ "$HAS_UPLOAD_KEY" = true ]; then
            cp $outputs/apk/release/app-release.apk out/uni-vpn.apk
            cp $outputs/bundle/release/app-release.aab out/uni-vpn.aab
          else
            cp $outputs/apk/release/app-release-unsigned.apk out/uni-vpn-unsigned.apk
          fi
          ls -l out
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Phone tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: packaging/android/emulator-test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android-app
          path: out/*
          retention-days: 7

  # The iPhone app (app/ios, docs/ios.md): libopenconnect, OpenSSL and the Go core for iOS, the
  # Xcode project, the simulator tests against Heidelberg's real gateway, and an unsigned device
  # archive. Signed and sent to TestFlight from main once the Apple Developer secrets exist
  # (App Store Connect takes only builds made with Xcode 26 and the iOS 26 SDK).
  ios:
    # The signed build goes to TestFlight: only once the core's tests pass, the iPhone tunnel's too.
    needs: [go, inprocess]
    runs-on: macos-26
    timeout-minutes: 90
    env:
      HAS_IOS_SIGNING: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 != '' && secrets.APP_STORE_CONNECT_API_KEY_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build tools
        run: brew install xcodegen autoconf automake libtool pkg-config
      # openconnect and OpenSSL for three slices take long; they change only with the script.
      - uses: actions/cache@v4
        with:
          path: app/ios/build/native
          key: ios-native-${{ hashFiles('packaging/ios/build-native.sh') }}
      - name: The core for iOS
        run: packaging/ios/build-core.sh "$GITHUB_SHA"
      - name: Xcode project
        run: cd app/ios && xcodegen
      - name: Tests in the simulator
        run: |
          cd app/ios
          # Runner images change which simulators they carry: take any iPhone, else make one.
          pick() {
            xcrun simctl list devices available -j | python3 -c 'import json, sys
          for runtime, devices in sorted(json.load(sys.stdin)["devices"].items(), reverse=True):
              for d in devices:
                  if "iOS" in runtime and d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()'
          }
          udid=$(pick)
          if [ -z "$udid" ]; then
            xcodebuild -downloadPlatform iOS
            runtime=$(xcrun simctl list runtimes -j | python3 -c 'import json, sys
          print([r["identifier"] for r in json.load(sys.stdin)["runtimes"] if r["platform"] == "iOS" and r["isAvailable"]][-1])')
            device=$(xcrun simctl list devicetypes -j | python3 -c 'import json, sys
          print([d["identifier"] for d in json.load(sys.stdin)["devicetypes"] if d["name"].startswith("iPhone")][-1])')
            udid=$(xcrun simctl create "CI iPhone" "$device" "$runtime")
          fi
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcodebuild -project UniVPN.xcodeproj -scheme UniVPN \
            -destination "id=$udid" -resultBundlePath build/tests.xcresult -quiet test
      - name: Why the tests failed
        if: failure()
        run: |
          cd app/ios
          xcrun xcresulttool get test-results tests --path build/tests.xcresult --compact || true
          # The core's own log in the simulator's App Group folder.
          find ~/Library/Developer/CoreSimulator/Devices/"$SIM_UDID"/data/Containers/Shared/AppGroup \
            -name '*.log' -type f -print -exec tail -n 80 {} \; 2>/dev/null || true
      - name: Unsigned archive for phones
        run: |
          cd app/ios
          xcodebuild -project UniVPN.xcodeproj -scheme UniVPN -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/UniVPN.xcarchive \
            MARKETING_VERSION="$UNI_VPN_VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO -quiet archive
          # App Store Connect refuses a bundle without its privacy manifest.
          for bundle in UniVPN.app Tunnel.appex Control.appex; do
            dir=$(find build/UniVPN.xcarchive/Products -name "$bundle" -type d | head -n 1)
            if [ -z "$dir" ] || [ ! -f "$dir/PrivacyInfo.xcprivacy" ]; then
              echo "::error::$bundle has no PrivacyInfo.xcprivacy"
              exit 1
            fi
          done
          # Nor one that calls a disk space API (statfs and the like) its manifest does not
          # declare: the core needs none (openconnect is built without, build-native.sh).
          app=$(find build/UniVPN.xcarchive/Products -name UniVPN.app -type d | head -n 1)
          for binary in "$app/UniVPN" "$app/PlugIns/Tunnel.appex/Tunnel"; do
            symbols=$(nm -u -j "$binary")
            if disk=$(grep -E '(^|[[:space:]])_(f?statv?fs(64)?|f?getattrlist|getattrlistat)$' <<<"$symbols"); then
              echo "::error::$(basename "$binary") calls a disk space API: $(echo $disk)"
              exit 1
            fi
          done
          mkdir -p ../../out
          ditto -c -k --keepParent build/UniVPN.xcarchive ../../out/UniVPN-unsigned.xcarchive.zip
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-test-results
          path: app/ios/build/tests.xcresult
          retention-days: 7
      - name: Signing keys
        if: env.HAS_IOS_SIGNING == 'true'
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          keychain="$RUNNER_TEMP/ios-signing.keychain-db"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p ci "$keychain"
          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/ios-distribution.p12"
          security import "$RUNNER_TEMP/ios-distribution.p12" -k "$keychain" -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          # Where xcodebuild and altool find the App Store Connect key.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"
      # Automatic signing with the API key: Xcode fetches or makes the profiles of the app, the
      # tunnel and the Control Center button itself.
      - name: Signed app to TestFlight
        if: env.HAS_IOS_SIGNING == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          cd app/ios
          auth=(-allowProvisioningUpdates
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID")
          xcodebuild -project UniVPN.xcodeproj -scheme UniVPN -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/UniVPN-signed.xcarchive \
            MARKETING_VERSION="$UNI_VPN_VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" "${auth[@]}" -quiet archive
          cat > build/export.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>destination</key><string>export</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/UniVPN-signed.xcarchive \
            -exportOptionsPlist build/export.plist -exportPath build/export "${auth[@]}"
          cp build/export/UniVPN.ipa ../../out/UniVPN.ipa
          xcrun altool --upload-app -f build/export/UniVPN.ipa -t ios \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: out/*
          retention-days: 7

  windows-openconnect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: fedora:42
    steps:
      - uses: actions/checkout@v4
      - run: packaging/windows/build-openconnect.sh openconnect-win64
      - uses: actions/upload-artifact@v4
        with:
          name: openconnect-win64
          path: openconnect-win64
          retention-days: 3

  windows-installer:
    needs: windows-openconnect
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Inno Setup
        shell: powershell
        run: |
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress | Out-Null }
            Add-Content $env:GITHUB_PATH "${env:ProgramFiles(x86)}\Inno Setup 6"
          }
      - uses: actions/download-artifact@v4
        with:
          name: openconnect-win64
          path: openconnect-win64
      # Runs with nothing else on PATH and checks the gateway's certificate against Windows' own.
      - name: openconnect.exe reaches a university gateway
        shell: bash
        run: |
          out=$(env PATH=/c/Windows/System32 openconnect-win64/openconnect.exe --non-inter --authenticate \
            --protocol=anyconnect vpn-ac.uni-heidelberg.de </dev/null 2>&1 || true)
          echo "$out" | tail -n 5
          if echo "$out" | grep -qi "certificate.*fail\|verify failed"; then exit 1; fi
          echo "$out" | grep -q "Connected to" || { echo "openconnect did not reach the gateway"; exit 1; }
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: The Go core and its files
        shell: bash
        run: packaging/stage-app.sh --go windows/both stage
      - name: The app window and OpenConnect
        shell: powershell
        run: |
          # The app window, ready built: users need no compiler and no SDK download. Python only
          # builds it here (into .\desktop); the installer has none.
          python -c "import sys; from uni_vpn import desktop; sys.exit(desktop.build_windows_app())"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Move-Item desktop stage\desktop
          Copy-Item -Recurse openconnect-win64 stage\openconnect
      # Switches on by itself with the Azure Trusted Signing secrets, like "Sign". Smart App Control
      # blocks every program and library without a signature, not only the installer; what
      # Microsoft and WireGuard signed keeps their signature.
      - name: Unsigned program files
        id: unsigned
        if: env.AZURE_CLIENT_ID != ''
        shell: powershell
        run: |
          $files = Get-ChildItem stage -Recurse -Include *.exe, *.dll |
            Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' } | ForEach-Object FullName
          Add-Content $env:GITHUB_OUTPUT "files=$($files -join ',')"
      - name: Sign the program files
        if: env.AZURE_CLIENT_ID != '' && steps.unsigned.outputs.files != ''
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files: ${{ steps.unsigned.outputs.files }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Build uni-vpn-setup.exe
        shell: powershell
        run: |
          # The app window alone, for the updates (core-files).
          New-Item -ItemType Directory -Force app-update\windows | Out-Null
          Copy-Item -Recurse stage\desktop app-update\windows\desktop
          # Signed, the core goes along: build-core.sh then puts this one into the update instead of its own.
          if ($env:AZURE_CLIENT_ID) {
            New-Item -ItemType Directory -Force app-update\windows\bin, app-update\windows-arm64\bin | Out-Null
            Copy-Item stage\bin\uni-vpn-core.exe app-update\windows\bin\
            Copy-Item stage\bin\arm64\uni-vpn-core.exe app-update\windows-arm64\bin\
          }
          New-Item -ItemType File -Path "stage\desktop\.prebuilt" | Out-Null
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path stage\openconnect\* -DestinationPath out\uni-vpn-openconnect-win64.zip
          iscc.exe /Q "/DAppVersion=$env:UNI_VPN_VERSION" "/DSourceDir=$PWD\stage" "/DOutputDir=$PWD\out" packaging\windows\uni-vpn.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      # Switches on by itself once the Azure Trusted Signing secrets exist (see docs/superpowers/specs).
      - name: Sign
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: out
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Install it like a user would
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\test-install.ps1
          exit $LASTEXITCODE
      - name: Uninstall it like a user would
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\test-uninstall.ps1
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: app-update
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: |
            out/uni-vpn-setup.exe
            out/uni-vpn-openconnect-win64.zip
          retention-days: 7

  # The same uni-vpn-setup.exe on a Windows 11 computer with an ARM processor: the ARM core,
  # and OpenConnect and the app window as emulated x64 programs.
  windows-arm-install:
    needs: windows-installer
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: installer-windows
          path: out
      - name: openconnect.exe reaches a university gateway
        shell: powershell
        run: |
          Expand-Archive out\uni-vpn-openconnect-win64.zip openconnect
          $env:PATH = "$env:SystemRoot\System32"
          $out = cmd /c "openconnect\openconnect.exe --non-inter --authenticate --protocol=anyconnect vpn-ac.uni-heidelberg.de < nul 2>&1"
          $out | Select-Object -Last 5 | Write-Host
          if ($out -match "certificate.*fail|verify failed") { exit 1 }
          if (-not ($out -match "Connected to")) { Write-Host "openconnect did not reach the gateway"; exit 1 }
          exit 0
      - name: Install it like a user would
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\test-install.ps1
          exit $LASTEXITCODE
      - name: Uninstall it like a user would
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\test-uninstall.ps1
          exit $LASTEXITCODE

  publish:
    # relay tests what "go" cannot: the sync client against the real relay code.
    needs: [promote, macos-pkg, linux-packages, windows-installer, windows-arm-install, core-files, relay]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: publish-installers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: out
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: core-files
          path: core
      # One release whose files are always the newest green main, like the "stable" branch.
      - name: Replace the files of the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A slower older run must not replace newer files.
          git fetch --quiet origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ] && git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "main has moved on, the newer run publishes"; exit 0
          fi
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title "Uni VPN" --latest \
              --notes "Download the file for your computer and open it: uni-vpn.pkg (Mac), uni-vpn-setup.exe (Windows), uni-vpn.deb (Ubuntu, Debian, Mint) or uni-vpn.rpm (Fedora)."
          fi
          # The manifest after its zips: it must never name a file that is not there yet. Both before
          # the installers: a new installer that finds the old manifest would update itself back.
          gh release upload latest core/uni-vpn-core-*.zip --clobber
          gh release upload latest core/core-manifest.json --clobber
          # uni-vpn-openconnect-win64.zip: what install.ps1 downloads when run without the installer.
          gh release upload latest out/uni-vpn.pkg out/uni-vpn-setup.exe out/uni-vpn.deb out/uni-vpn.rpm \
            out/uni-vpn-arm64.deb out/uni-vpn-arm64.rpm out/uni-vpn-openconnect-win64.zip --clobber
          gh release edit latest --notes "Version $UNI_VPN_VERSION, $(date -u +%Y-%m-%d). Download the file for your computer and open it: uni-vpn.pkg (Mac), uni-vpn-setup.exe (Windows), uni-vpn.deb (Ubuntu, Debian, Mint) or uni-vpn.rpm (Fedora)."

  # Only a signed app goes to the release page; sideloading is not the way for users
  # (docs/android.md), but it lets testers install the newest build. After "publish", so the
  # release exists and its tag is this commit.
  publish-android:
    needs: [publish, android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Not "publish-installers": a run waiting here would cancel the next run's waiting "publish".
    concurrency: publish-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-app
          path: out
      - name: Add the signed app to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f out/uni-vpn.apk ]; then echo "no upload key yet, nothing to publish"; exit 0; fi
          git fetch --quiet origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then echo "main has moved on, the newer run publishes"; exit 0; fi
          gh release upload latest out/uni-vpn.apk --clobber
