name: CI
on:
  push:
  pull_request:
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Python version
        run: python3 --version
      - name: Syntax (compileall)
        run: python3 -m compileall -q uni_vpn bin/uni-vpn tests
      - name: Unit tests
        run: python3 -m unittest discover -s tests -t . -v
      - name: Shell syntax
        run: bash -n install.sh get.sh
      - name: Installer dry run
        run: ./install.sh --dry-run --user citest
      - name: Check launchd plist
        if: runner.os == 'macOS'
        run: |
          python3 - <<'EOF'
          from uni_vpn import service
          open("/tmp/uni-vpn.plist", "w").write(service.render_unit("/opt/homebrew/bin/python3", "/tmp/uni-vpn", "/tmp/logs", "/opt/homebrew"))
          EOF
          plutil -lint /tmp/uni-vpn.plist

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax (compileall)
        run: python -m compileall -q uni_vpn bin/uni-vpn tests
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: PowerShell syntax
        shell: powershell
        run: |
          foreach ($file in "install.ps1", "get.ps1") {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | Format-List | Out-String | Write-Host; exit 1 }
          }
      - name: Installer dry run
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -DryRun -User citest
