<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Uni VPN</title>
<!-- Status page: Uni VPN (/status.json, /api/*). Role models: Mullvad VPN / Tailscale for the
     status screen (one state, one button, settings behind a gear), Google sign-in for the setup
     assistant (one step per card, primary action bottom right, Back bottom left), Google
     Authenticator for the check code with its countdown ring, iOS/macOS Settings for the
     grouped settings list, Mullvad VPN and Spotify for the language (follows the system, can be
     changed in Settings, every language in its own name), Signal and WhatsApp linked devices
     with Brave Sync for syncing (a device list with Remove, "Add a device" shows a QR code with
     a code to type under it, the new device scans or types it). -->
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#e3e3e8;--field:#fff;
  --accent:#0b57d0;--accent-text:#fff;--ok:#1e8e3e;--warn:#e37400;--bad:#d93025;--idle:#80868b;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.06);--on-color:#fff;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#141416;--card:#1f1f22;--text:#ececf0;--muted:#9a9aa3;--line:#33333a;--field:#26262b;
    --accent:#8ab4f8;--accent-text:#0b1a33;--ok:#81c995;--warn:#fdd663;--bad:#f28b82;--idle:#9aa0a6;
    --shadow:0 1px 3px rgba(0,0,0,.4);--on-color:#1f1f22}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif}
[hidden]{display:none!important}
.wrap{max-width:420px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:28px 24px}
.bar{display:flex;align-items:center;justify-content:space-between;height:44px;margin-bottom:12px}
.bar h1{font-size:17px;font-weight:600;margin:0}
.icon-btn{border:0;background:none;color:var(--muted);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{background:var(--line)}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h2{font-size:24px;font-weight:500;margin:0 0 6px;outline:none}
.sub{color:var(--muted);margin:0 0 24px}
.field{display:block;margin:0 0 16px}
.field>span,.field>.row-title label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field>.row-title{display:flex;margin-bottom:6px}
.field>.row-title label{margin:0}
.input{position:relative}
input,textarea,select{width:100%;font:inherit;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.7}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.item select{width:auto;max-width:60%;border:0;background:none;color:var(--muted);padding:0 0 0 12px;text-align:right;cursor:pointer}
.item select:focus{box-shadow:none}.item select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.input input{padding-right:44px}
.input .icon-btn{position:absolute;right:2px;top:2px}
.error{color:var(--bad);font-size:13px;margin:-8px 0 14px}
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:28px}
.btn{font:inherit;font-weight:500;border-radius:999px;padding:10px 22px;border:0;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-text)}
.btn.text{background:none;color:var(--accent);padding:10px 8px}
#toggle.text{margin-top:8px}
.btn:disabled{opacity:.45;cursor:default}
.btn.big{width:100%;padding:14px;font-size:16px}
a.btn{display:inline-block;text-decoration:none}
.row-title{display:flex;align-items:center;gap:6px}
.info{position:relative;display:inline-grid}
.info>button{border:0;background:none;color:var(--muted);padding:0;cursor:pointer;display:grid}
.info svg{width:17px;height:17px}
.pop{position:absolute;z-index:5;top:24px;left:-12px;width:min(290px,calc(100vw - 32px));background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;font-size:13px;color:var(--text)}
.code{display:flex;align-items:center;gap:14px;background:var(--bg);border-radius:12px;padding:12px 14px;margin:4px 0 0}
.code b{font:600 28px/1 ui-monospace,"SF Mono",Consolas,monospace;letter-spacing:.12em;color:var(--accent);white-space:nowrap}
.ring{width:26px;height:26px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}
.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--accent);stroke-dasharray:62.8;transition:stroke-dashoffset 1s linear}
.small{font-size:13px;color:var(--muted)}
.center{text-align:center}
.badge{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;margin:8px auto 18px;color:var(--on-color);background:var(--idle);transition:background .3s}
.badge svg{width:46px;height:46px;stroke-width:1.8}
.badge.ok{background:var(--ok)}.badge.warn{background:var(--warn)}.badge.bad{background:var(--bad)}
.badge.busy svg{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.state{font-size:24px;font-weight:600;margin:0 0 6px}
.msg{color:var(--muted);min-height:1.45em;margin:0 0 24px}
.spinner{width:40px;height:40px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite;margin:24px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.list{background:var(--card);border-radius:14px;box-shadow:var(--shadow);margin-bottom:20px}
.list details,.list .item{border-top:1px solid var(--line)}
.list>:first-child{border-top:0}
.list summary,.list .item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;list-style:none}
.list summary::-webkit-details-marker{display:none}
.list .val{color:var(--muted);max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:auto}
#v-uni{white-space:normal;text-align:right}
.list summary:after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .2s}
.list details[open] summary:after{transform:rotate(45deg)}
.list .item{cursor:default}
.list button.item{width:100%;font:inherit;color:inherit;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.list button.item>:first-child{flex:none}
.list button.item:after{content:"";flex:none;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg)}
body.app{-webkit-user-select:none;user-select:none;cursor:default}
body.app input,body.app textarea,body.app pre{-webkit-user-select:text;user-select:text}
body.app .brand{visibility:hidden}
body.app #setup .bar:has(#cancel-change[hidden]){display:none}
.list .body{padding:0 16px 16px}
.list .body .btn{margin-top:10px}
.group{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px 16px}
pre{font-size:12px;background:var(--bg);border-radius:10px;padding:10px;max-height:260px;overflow:auto;white-space:pre-wrap;margin:0}
.saved{color:var(--ok);font-size:13px;margin-left:10px;white-space:pre-line}
.saved.bad{color:var(--bad)}
.step{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px}
.shot{display:block;width:100%;height:auto;aspect-ratio:360/210;border-radius:10px;margin:14px 0 14px}
.guide-text{margin:0 0 14px;min-height:2.9em}
.guide-text a{color:var(--accent);font-weight:500}
.warn{color:var(--warn);font-size:13px;margin:-6px 0 14px}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px dashed var(--line);border-radius:12px;padding:16px 12px 8px;color:var(--muted);text-align:center;outline:none;transition:border-color .2s,background .2s}
.drop>svg{width:28px;height:28px;color:var(--accent)}
.drop:focus-visible,.drop.over{border-color:var(--accent);background:var(--bg)}
.drop.done{border-style:solid;border-color:var(--ok);color:var(--text)}
.drop.done>svg{color:var(--ok)}
.drop{position:relative}.drop>input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.drop .info{z-index:1}
.drop .row-title{gap:2px}
.dots{display:flex;justify-content:center;gap:6px;margin:20px 0 -12px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.code .hint{font-size:13px;color:var(--muted);margin-left:auto;text-align:right}
.options{list-style:none;margin:6px 0 0;padding:4px;border:1px solid var(--line);border-radius:10px;max-height:264px;overflow:auto}
.options li{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer}
.options li[aria-selected=true]{background:var(--bg)}
.options li:last-child{color:var(--accent)}
#s-detect{margin:-8px 0 12px -8px}
input.switch{appearance:none;-webkit-appearance:none;flex:none;width:44px;height:26px;padding:0;margin:0;border:0;border-radius:13px;background:var(--line);position:relative;cursor:pointer;transition:background .2s}
input.switch:before{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s}
input.switch:checked{background:var(--ok)}
input.switch:checked:before{transform:translateX(18px)}
input.switch:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.qr{width:200px;height:200px;margin:4px auto 16px;border-radius:12px;overflow:hidden;background:#fff}
.qr svg{width:100%;height:100%;display:block;stroke:none}
.pair-code{font:600 22px/1.2 ui-monospace,"SF Mono",Consolas,monospace;letter-spacing:.08em;margin:0 0 6px}
#pair-entry input{text-transform:uppercase;font-family:ui-monospace,"SF Mono",Consolas,monospace;letter-spacing:.08em;text-align:center}
.list .item .remove{color:var(--bad);padding:4px 0 4px 12px}
#devices .item>:first-child{min-width:0;overflow-wrap:anywhere}
#devices .val{flex:none;max-width:none}
#v-dom{flex:none}
.list button.item.add{color:var(--accent)}
.list button.item.add:after{display:none}
#s-use-other{display:block;margin:16px auto 0}
#pair-err{margin:16px 0 0}
.offline{background:var(--bad);color:var(--on-color);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="offline" id="offline" role="alert" data-t="msg.not_running" hidden></div>

  <!-- Setup assistant -->
  <section id="setup" hidden>
    <div class="bar"><button class="icon-btn" id="cancel-change" data-t-label="app.back" hidden><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button><h1 class="brand">Uni VPN</h1><span style="width:40px"></span></div>
    <div class="card">
      <form id="step0" autocomplete="off">
        <p class="step"></p>
        <h2 data-t="app.university"></h2>
        <div class="field"><span class="row-title"><label for="s-uni" data-t="setup.find"></label>
          <span class="info"><button type="button" data-t-label="app.help"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></button>
            <span class="pop" data-t="setup.find_help" hidden></span></span></span>
          <input id="s-uni" role="combobox" aria-expanded="false" aria-controls="s-uni-list" aria-autocomplete="list" autocomplete="off" spellcheck="false" data-t-placeholder="setup.find_placeholder">
          <ul class="options" id="s-uni-list" role="listbox" data-t-label="setup.universities" hidden></ul></div>
        <div id="s-other" hidden>
          <label class="field"><span data-t="setup.vpn_address"></span>
            <input id="s-host" autocapitalize="none" spellcheck="false" placeholder="vpn.example.edu"></label>
          <button class="btn text" type="button" id="s-detect" data-t="setup.detect"></button>
          <label class="field" id="s-group-row" hidden><span data-t="setup.group"></span><select id="s-group"></select></label>
          <label class="field" id="s-mfa-row" hidden><span data-t="app.second_factor"></span><select id="s-mfa">
            <option value="none" data-t="setup.mfa.none"></option><option value="totp_field" data-t="setup.mfa.totp_field"></option>
            <option value="totp_append" data-t="setup.mfa.totp_append"></option><option value="duo_push" data-t="setup.mfa.duo_push"></option></select></label>
        </div>
        <p class="error" id="s0-err" role="alert" hidden></p>
        <div class="actions"><span></span><button class="btn primary" type="submit" data-t="app.next"></button></div>
        <button class="btn text" type="button" id="s-use-other" data-t="sync.use_other" hidden></button>
      </form>

      <form id="step1" autocomplete="on" hidden>
        <p class="step"></p>
        <h2 data-t="setup.sign_in"></h2>
        <p class="sub" id="s1-sub"></p>
        <label class="field"><span data-t="app.username"></span>
          <input id="s-user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="ab123"></label>
        <label class="field"><span data-t="app.password"></span>
          <div class="input"><input id="s-pw" type="password" name="password" autocomplete="current-password">
            <button type="button" class="icon-btn reveal" data-for="s-pw" data-t-label="app.show_password"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></label>
        <p class="error" id="s1-err" role="alert" hidden></p>
        <div class="actions"><button class="btn text" type="button" data-back="step0" data-t="app.back"></button><button class="btn primary" type="submit" data-t="app.next"></button></div>
      </form>

      <!-- Second factor, the short way: one code from the user's authenticator app, then the core
           adds its own code generator in the MFA portal. Role model: Microsoft Authenticator's
           "sign in to add your work account". The picture guide stays one click away. -->
      <form id="step2a" hidden>
        <p class="step"></p>
        <h2 data-t="app.second_factor"></h2>
        <p class="sub" id="a-text" aria-live="polite"></p>
        <div class="field" id="a-field"><span class="row-title"><label for="a-code" data-t="setup.code"></label>
          <span class="info"><button type="button" data-t-label="app.help"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></button>
            <span class="pop" data-t="setup.auto_help" hidden></span></span></span>
          <input id="a-code" inputmode="numeric" autocomplete="one-time-code" maxlength="9" spellcheck="false" placeholder="123456"></div>
        <div class="spinner" id="a-busy" hidden></div>
        <p class="error" id="a-err" role="alert" hidden></p>
        <div class="actions"><button class="btn text" type="button" id="a-back" data-t="app.back"></button><button class="btn primary" type="submit" id="a-next" data-t="app.next"></button></div>
        <button class="btn text" type="button" id="a-fix" data-t="main.repair" hidden></button>
        <a class="btn text" id="a-download" href="https://vpn.davidvinu.de/" target="_blank" rel="noopener" data-t="main.download" hidden></a>
        <button class="btn text" type="button" id="a-guide" data-t="setup.by_hand"></button>
      </form>

      <!-- Second factor: a picture guide through the university's MFA portal, one step at a time.
           Role models: Microsoft's "Keep your account secure" wizard (a picture per step, Next and
           Back), 1Password and Bitwarden (add a code from a picture of its QR code). -->
      <form id="step2" hidden>
        <p class="step"></p>
        <h2 tabindex="-1" data-t="app.second_factor"></h2>
        <img class="shot" id="g-shot" alt="" hidden onerror="this.hidden=true">
        <p class="guide-text" id="g-text" aria-live="polite"></p>
        <p class="warn" id="g-away" data-t="setup.portal_away" hidden></p>
        <div class="drop" id="g-drop" tabindex="0" hidden>
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3M21 14v.01M14 21h7v-4"/></svg>
          <span id="g-drop-text" data-t="setup.drop"></span>
          <span class="row-title"><button type="button" class="btn text" id="g-choose" data-t="setup.choose_picture"></button>
            <span class="info"><button type="button" data-t-label="app.help"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></button>
              <span class="pop" data-t="setup.drop_help" hidden></span></span></span>
          <input type="file" id="g-file" accept="image/*" tabindex="-1" aria-hidden="true">
        </div>
        <input id="s-totp" type="password" autocomplete="off" hidden>
        <p class="error" id="s2-err" role="alert" hidden></p>
        <div class="code" id="s-code" hidden>
          <svg class="ring" viewBox="0 0 24 24"><circle class="bg" cx="12" cy="12" r="10"/><circle class="fg" cx="12" cy="12" r="10"/></svg>
          <b></b><span class="hint" data-t="setup.check_code"></span>
        </div>
        <div class="dots" id="g-dots" aria-hidden="true"></div>
        <div class="actions"><button class="btn text" type="button" id="g-back" data-t="app.back"></button><button class="btn primary" type="submit" data-t="app.next"></button></div>
      </form>

      <div id="step3" hidden class="center">
        <div class="spinner"></div>
        <p class="step"></p>
        <h2 tabindex="-1" data-t="look.connecting"></h2>
        <p class="sub" id="s3-msg" aria-live="polite">&nbsp;</p>
        <div class="actions"><button class="btn text" type="button" id="s3-back" data-t="app.back"></button><button class="btn text" type="button" id="s3-skip" data-t="setup.finish" hidden></button></div>
        <button class="btn text" type="button" id="s3-fix" data-t="main.repair" hidden></button>
        <a class="btn text" id="s3-download" href="https://vpn.davidvinu.de/" target="_blank" rel="noopener" data-t="main.download" hidden></a>
      </div>

      <div id="step4" hidden class="center">
        <div class="badge ok"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
        <h2 tabindex="-1" data-t="setup.all_set"></h2>
        <p class="sub" id="s4-msg"></p>
        <div class="actions" style="justify-content:center"><button class="btn primary" type="button" id="s4-done" data-t="app.done"></button></div>
      </div>
    </div>
  </section>

  <!-- Status -->
  <section id="main" hidden>
    <div class="bar"><h1 class="brand">Uni VPN</h1>
      <button class="icon-btn" id="open-settings" data-t-label="settings.title"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
    <div class="card center">
      <div class="badge" id="badge"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
      <div aria-live="polite"><p class="state" id="state">&nbsp;</p>
      <p class="msg" id="msg">&nbsp;</p></div>
      <button class="btn primary big" id="fix" type="button" hidden></button>
      <!-- A program the installer brought is gone: the download page, in the default browser. -->
      <a class="btn primary big" id="download" href="https://vpn.davidvinu.de/" target="_blank" rel="noopener" data-t="main.download" hidden></a>
      <button class="btn primary big" id="toggle" type="button"></button>
    </div>
  </section>

  <!-- Settings -->
  <section id="settings" hidden>
    <div class="bar"><button class="icon-btn" id="close-settings" data-t-label="app.back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button><h1 data-t="settings.title"></h1><span style="width:40px"></span></div>
    <p class="group" data-t="settings.account"></p>
    <div class="list">
      <button class="item" type="button" id="row-uni"><span data-t="app.university"></span><span class="val" id="v-uni"></span></button>
      <button class="item" type="button" id="row-user"><span data-t="app.username"></span><span class="val" id="v-user"></span></button>
      <details id="d-pw"><summary><span data-t="app.password"></span></summary><div class="body">
        <form id="pwform"><div class="input"><input type="password" id="pw" autocomplete="current-password" data-t-label="app.password">
          <button type="button" class="icon-btn reveal" data-for="pw" data-t-label="app.show_password"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
        <button class="btn primary" type="submit" data-t="app.save"></button><span class="saved" id="pwmsg" role="status"></span></form></div></details>
      <button class="item" type="button" id="row-totp"><span data-t="app.second_factor"></span><span class="val"></span></button>
    </div>
    <p class="group" data-t="settings.websites"></p>
    <div class="list">
      <details id="d-dom"><summary><span class="row-title"><span data-t="settings.through"></span>
        <span class="info"><button type="button" data-t-label="settings.about_domains"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></button>
          <span class="pop" data-t="settings.domains_help" hidden></span></span></span>
        <span class="val" id="v-dom"></span></summary><div class="body">
        <form id="domform"><textarea id="domains" rows="5" spellcheck="false" data-t-label="settings.domains"></textarea>
        <button class="btn primary" type="submit" data-t="app.save"></button><span class="saved" id="dommsg" role="status"></span></form></div></details>
    </div>
    <div id="devices-group" hidden>
      <p class="group" data-t="settings.devices"></p>
      <div class="list" id="devices"></div>
      <p class="error" id="sync-err" role="status" hidden></p>
    </div>
    <p class="group" data-t="settings.general"></p>
    <div class="list">
      <label class="item"><span data-t="settings.language"></span><select id="language"></select></label>
    </div>
    <p class="group" data-t="settings.about"></p>
    <div class="list">
      <details><summary><span data-t="settings.log"></span></summary><div class="body"><pre id="log"></pre></div></details>
      <label class="item"><span data-t="settings.auto_update"></span><input type="checkbox" class="switch" id="auto-update" role="switch"></label>
      <div class="item"><span data-t="settings.version"></span><span class="small" id="v-ver"></span></div>
    </div>
  </section>

  <!-- Linking another device: role models Signal "Link new device" and WhatsApp Web -->
  <section id="pair" hidden>
    <div class="bar"><button class="icon-btn" id="close-pair" data-t-label="app.back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button><h1 id="pair-title"></h1><span style="width:40px"></span></div>
    <div class="card center">
      <div id="pair-show">
        <div class="qr" id="pair-qr"></div>
        <p class="pair-code" id="pair-code"></p>
        <p class="sub" id="pair-sub"></p>
        <button class="btn text" type="button" id="pair-new" data-t="sync.new_code" hidden></button>
        <button class="btn text" type="button" id="pair-type" data-t="sync.enter"></button>
      </div>
      <form id="pair-entry" hidden autocomplete="off">
        <label class="field"><span data-t="sync.code"></span>
          <input id="pair-input" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX" maxlength="40"></label>
        <div class="actions"><span></span><button class="btn primary" type="submit" data-t="app.next"></button></div>
      </form>
      <div id="pair-done" hidden>
        <div class="badge ok"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
        <h2 tabindex="-1" data-t="sync.done"></h2>
        <div class="actions" style="justify-content:center"><button class="btn primary" type="button" id="pair-ok" data-t="app.done"></button></div>
      </div>
      <p class="error" id="pair-err" role="alert" hidden></p>
    </div>
  </section>
</div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const H = {"X-Uni-VPN": "1", "Content-Type": "application/json"};
let S = null, view = null, setupDone = false, submitting = false, setupSent = false, domainsShown = false, connectRequested = 0,
  codeTimer = null, refreshing = false, autoUpdateSaving = false, changing = false, languageSaving = false,
  domainsBase = "", removeError = null, removeSeen = false, changeWebsites = "", pageCore;
// Inside the Uni VPN app window (not a browser tab): no page title, no browser context menu.
if (new URLSearchParams(location.search).has("app")) {
  document.body.classList.add("app");
  document.addEventListener("contextmenu", (e) => { if (!e.target.closest("input, textarea, pre")) e.preventDefault(); });
}

async function post(path, body) {
  const r = await fetch(path, {method: "POST", headers: H, body: JSON.stringify(body || {})});
  const text = await r.text();
  let data = null;
  try { data = JSON.parse(text); } catch (e) { /* plain text error */ }
  return {ok: r.ok, data, text};
}

// --- language ----------------------------------------------------------------
// Like macOS and Windows apps: the system's language unless chosen in Settings, else English.
let L = {languages: [["en", "English"]], catalogs: {en: {}}}, lang = "en", localesLoaded = false;

async function loadLocales() {
  try {
    const r = await fetch("/locales.json", {cache: "no-store"});
    // Only our core's texts: another account's uni-vpn answers 403 with an error in JSON.
    const next = r.ok ? await r.json() : null;
    if (next && next.catalogs && next.languages) { L = next; localesLoaded = true; }
  } catch (e) { /* keys until the core answers again (refresh) */ }
}

function systemLanguage() {
  const codes = L.languages.map(([code]) => code);
  for (const tag of navigator.languages || [navigator.language || ""]) {
    const [base, ...rest] = tag.toLowerCase().split("-");
    if (base === "zh") return !rest.includes("hans") && rest.some((p) => ["hant", "tw", "hk", "mo"].includes(p)) ? "zh-Hant" : "zh-Hans";
    if (codes.includes(base)) return base;
  }
  return "en";
}

function t(key, args) {
  const text = L.catalogs[lang]?.[key] ?? L.catalogs.en?.[key] ?? key;
  return text.replace(/\{(\w+)\}/g, (m, name) => (args && name in args ? arg(args[name]) : m));
}
function arg(value) {
  if (Array.isArray(value)) return value.map(arg).join("\n");
  return value && typeof value === "object" ? t(value.key, value.args) : String(value);
}
function plural(key, n) { return t(key + "." + new Intl.PluralRules(lang).select(n), {n}); }

// A message from the service: in the user's language when it came with a key.
function tr(text, key) { return key ? t(key.key, key.args) : String(text || ""); }
function errText(r) { return r.data ? tr(r.data.error, r.data.error_t) || r.text : r.text; }

// code: the setting from Settings, "" for the system's language.
function applyLanguage(code) {
  const next = L.catalogs[code] ? code : systemLanguage();
  if (next === lang && document.documentElement.dataset.ready) {
    if (document.activeElement !== $("language")) $("language").value = L.catalogs[code] ? code : "";
    return;
  }
  lang = next;
  document.documentElement.lang = lang;
  document.documentElement.dataset.ready = "1";
  for (const el of document.querySelectorAll("[data-t]")) el.textContent = t(el.dataset.t);
  for (const el of document.querySelectorAll("[data-t-placeholder]")) el.placeholder = t(el.dataset.tPlaceholder);
  for (const el of document.querySelectorAll("[data-t-label]")) el.setAttribute("aria-label", t(el.dataset.tLabel));
  $("g-file").title = t("setup.choose_picture"); // else the engine's "No file chosen" on hover
  $("language").replaceChildren(new Option(t("settings.language_system"), ""),
    ...L.languages.map(([c, name]) => new Option(name, c)));
  $("language").value = L.catalogs[code] ? code : "";
  OTHER.name = t("setup.not_listed");
  if (uni && uni.id === "other") $("s-uni").value = OTHER.name;
  if (UNIS) numberSteps();
  signInSub();
  if (!$("step2").hidden) renderGuide();
}

function show(id) {
  for (const s of ["setup", "main", "settings", "pair"]) $(s).hidden = s !== id;
  view = id;
  // The app's menu opens #main or #settings; cleared so that the next request is a change again.
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);
}

function step(id, focusId) {
  if (id === "step2a" && offeredKey) id = "step2";  // a key from a link: the guide's test step
  autoRepair = !!(S && S.repairing);  // each visit starts without a Repair, unless one still runs
  for (const s of ["step0", "step1", "step2a", "step2", "step3", "step4"]) $(s).hidden = s !== id;
  if (id === "step2a") renderAuto();
  if (id === "step2") {
    renderGuide();
    checkPortal();
    if (keyRead) useKey($("s-totp").value, true);  // the code shown must be the current one
    if (offeredKey) { const key = offeredKey; offeredKey = ""; useKey(key); }
  }
  const focus = focusId ? $(focusId) : $(id).querySelector("input:not([hidden]):not([type=file])") || $(id).querySelector("h2");
  if (focus) focus.focus();
}


function err(id, text) { $(id).textContent = text || ""; $(id).hidden = !text; }

// --- status ------------------------------------------------------------------
// Message ids (messages.py) whose state label says it all.
const QUIET = ["not_connected", "disconnected", "connecting", "connected", "disconnecting", "setup_needed"];
const FIX = {password: "main.update_password", totp: "main.update_totp", repair: "main.repair"};
const LOOK = {
  connected: "ok", connecting: "warn busy", disconnecting: "warn busy", idle: "", offline: "warn", blocked: "warn",
  auth_failed: "bad", keyring: "bad", error: "bad",
};

// A Repair running is its fix on the way (the core offers no action meanwhile): its button stays,
// greyed, and connecting waits for it.
function fixAction() { return S.message_id === "repairing" ? "repair" : S.action; }

function render() {
  $("badge").className = "badge " + (LOOK[S.state] || "");
  $("state").textContent = S.state in LOOK ? t("look." + S.state) : S.state;
  // Normal states speak for themselves; only show the service's text when it explains something.
  const quiet = QUIET.includes(S.message_id);
  const hint = {idle: t("main.hint.idle"), connected: t("main.hint.connected")}[S.state];
  $("msg").textContent = quiet ? hint || "\u00a0" : tr(S.message, S.message_t);
  // Role model Tailscale: the problem in one sentence, the fix on the button below it.
  const repairing = S.message_id === "repairing";
  const fix = FIX[fixAction()] ? t(FIX[fixAction()]) : "";
  $("fix").hidden = !fix;
  $("fix").textContent = fix || "";
  $("fix").disabled = !!S.repairing;
  // Repair cannot bring back what the installer brought: the download is the fix then.
  const download = S.message_id === "reinstall_needed";
  $("download").hidden = !download;
  // With a fix offered, it is the way forward; retrying stays possible.
  const stopped = ["auth_failed", "keyring"].includes(S.state);
  $("toggle").className = fix || download ? "btn text" : "btn primary big";
  $("toggle").textContent = t(isOn() ? "main.disconnect" : fix || download || stopped ? "main.try_again" : "main.connect");
  $("toggle").disabled = S.state === "disconnecting" || (repairing && !isOn());
  $("v-uni").textContent = S.university_name;
  $("v-user").textContent = S.user;
  $("row-totp").hidden = !TOTP_MODES.includes(S.mfa);
  $("v-ver").textContent = S.version;
  $("v-ver").title = S.commit ? S.commit.slice(0, 7) : "";
  if (!autoUpdateSaving) $("auto-update").checked = S.auto_update !== false;
  $("v-dom").textContent = plural("settings.domain_count", (S.domains || []).length);
  // Only on change, so a selection in the log survives the next poll.
  const log = (S.log_tail || []).join("\n");
  if ($("log").textContent !== log) $("log").textContent = log;
  // A list changed elsewhere (a website added on the phone, synced when Settings opens) replaces
  // the one shown, unless it is being edited: saving the old one would remove it everywhere.
  const domains = (S.domains || []).join("\n");
  if (!domainsShown || ($("domains").value === domainsBase && domains !== domainsBase)) {
    $("domains").value = domainsBase = domains;
    domainsShown = true;
  }
  renderDevices();
}

// Connected, or a connect loop still trying (offline, blocked, error): the button stops it.
function isOn() { return !!S && (S.state === "connected" || (S.busy && S.state !== "disconnecting")); }

async function refresh() {
  if (refreshing) return;  // a slow answer must not overwrite a newer one
  refreshing = true;
  try {
    const res = await fetch("/status.json", {cache: "no-store"});
    // Another account's uni-vpn has the port now (fast user switching): its page says so.
    if (res.status === 403) { location.reload(); return; }
    S = await res.json();
    $("offline").hidden = true;
  } catch (e) {
    $("offline").hidden = false;
    return;
  } finally {
    refreshing = false;
  }
  // An update brings its page with the new core. The app windows keep theirs while hidden: a
  // hidden one on the main screen takes the new page (also its texts).
  const core = S.version + " " + S.commit;
  if (pageCore === undefined) pageCore = core;
  else if (core !== pageCore && document.visibilityState === "hidden" && view === "main" && !changing) {
    location.reload();
    return;
  }
  // The core was away when the page asked for its texts (a restart just then).
  if (!localesLoaded) {
    await loadLocales();
    if (localesLoaded) delete document.documentElement.dataset.ready;
  }
  if (!languageSaving) applyLanguage(S.language);
  $("s-use-other").hidden = !(S.sync && S.sync.available) || changing;
  if (view === "pair") { renderPair(); return; }
  if (S.setup_needed && !setupDone) {
    if (view !== "setup") { show("setup"); await loadUniversities(); step(uni ? "step1" : "step0", uni && $("s-user").value ? "s-pw" : null); }
    else if (!UNIS) loadUniversities();  // the core was away at the first try
    return;
  }
  if (view === "setup" && !setupSent && !changing) {
    show("main");  // set up meanwhile in another tab or with the command line
  }
  if (offeredKey) useOffered();
  // A reload or the reopened app while the core still runs the short way: back to its code page,
  // the main screen has nowhere to type the next code.
  if (view === null && S.enroll && ["connecting", "code", "working"].includes(S.enroll.stage)) await resumeAuto();
  if (view === "setup") { autoProgress(); setupProgress(); restoreFocus(); return; }
  if (view === null) {
    if (location.hash === "#settings") openSettings(); else show("main");
  }
  render();
  restoreFocus();
}

// A button disabled while it has the focus (Connect, Repair) drops it to the page, WebKit a
// moment later: once enabled again it gets it back, so Enter and Tab go on from there.
let refocus = null;
function press(button) {
  if (document.activeElement === button) refocus = button;
  button.disabled = true;
}
function restoreFocus() {
  const b = refocus, active = document.activeElement;
  if (!b || b.disabled) return;
  refocus = null;
  if ((!active || active === document.body) && b.offsetParent !== null) b.focus();
}

// --- setup assistant ---------------------------------------------------------
// Role models: eduroam CAT (find your institution), Thunderbird account setup (list, detect, manual).
const USER_RE = /^[A-Za-z0-9][A-Za-z0-9._-]{0,63}(@[A-Za-z0-9][A-Za-z0-9.-]{0,252})?$/;
const TOTP_MODES = ["totp_field", "totp_append"];
const OTHER = {id: "other", name: "", country: "", mfa: "none", mfa_portal_url: "", mfa_steps: []};
let UNIS = null, uni = null, active = -1, detectSeq = 0;

// The installer passes what it was given (setup --user, --university) in the address.
const params = new URLSearchParams(location.search);
const givenUser = params.get("user");
if (givenUser && USER_RE.test(givenUser)) $("s-user").value = givenUser;

async function loadUniversities() {
  if (UNIS) return;
  // Not kept when it fails: an empty list would make every university "Not listed".
  try { UNIS = (await (await fetch("/universities.json", {cache: "no-store"})).json()).universities; } catch (e) { /* next time */ }
  if (UNIS && !$("s-uni-list").hidden) renderList();  // opened meanwhile with "Not listed" alone
  const given = (UNIS || []).find((u) => u.id === params.get("university"));
  if (given && given.mfa !== "saml" && !uni) pick(given);
  numberSteps();
}

// Lower case without accents and umlaut spellings, like the registry's own search.
const fold = (s) => String(s || "").normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase()
  .replace(/ue/g, "u").replace(/oe/g, "o").replace(/ae/g, "a");

// Every word somewhere ("Uni Heidelberg", "Uni Köln").
function matches(query) {
  const words = fold(query).split(/\s+/).filter(Boolean);
  return (UNIS || []).filter((u) => words.every((w) => [u.id, u.name, u.host, ...(u.aliases || [])].some((t) => fold(t).includes(w))));
}

function mfa() { return uni && uni.id === "other" ? $("s-mfa").value : uni ? uni.mfa : "totp_field"; }
function needsTotp() { return TOTP_MODES.includes(mfa()); }

function numberSteps() {
  const ids = ["step0", "step1", ...(needsTotp() ? ["step2"] : []), "step3"];
  ids.forEach((id, i) => { $(id).querySelector(".step").textContent = t("setup.step", {n: i + 1, total: ids.length}); });
  $("step2a").querySelector(".step").textContent = $("step2").querySelector(".step").textContent;
}

function closeList() { $("s-uni-list").hidden = true; $("s-uni").setAttribute("aria-expanded", "false"); active = -1; }

function renderList() {
  const list = $("s-uni-list"), found = [...matches($("s-uni").value).slice(0, 7), OTHER];
  active = Math.min(active, found.length - 1);
  list.replaceChildren(...found.map((u, i) => {
    const li = document.createElement("li");
    li.id = "s-uni-" + u.id;
    li.setAttribute("role", "option");
    li.setAttribute("aria-selected", String(i === active));
    li.textContent = u.name;
    if (u.country) { const c = document.createElement("span"); c.className = "small"; c.textContent = u.country; li.append(c); }
    li.onmousedown = (e) => { e.preventDefault(); pick(u); };
    return li;
  }));
  list.hidden = false;
  $("s-uni").setAttribute("aria-expanded", "true");
  $("s-uni").setAttribute("aria-activedescendant", active >= 0 ? "s-uni-" + found[active].id : "");
  return found;
}

// Some universities want another password than the usual one, or the full address.
function signInSub() {
  const own = uni && `uni.${uni.id}.sign_in`;
  $("s1-sub").textContent = own && L.catalogs.en?.[own] ? t(own) : t("setup.sign_in_sub");
}

function pick(u) {
  uni = u;
  // A detection still running was for the address before (startChange fills it in after this).
  detectSeq++;
  $("s-detect").disabled = false;
  $("s-uni").value = u.name;
  closeList();
  $("s-other").hidden = u.id !== "other";
  err("s0-err", u.mfa === "saml" ? t("setup.saml") : "");
  numberSteps();
  signInSub();
  if (u.id === "other") $("s-host").focus();
}

$("s-uni").oninput = () => { uni = null; detectSeq++; $("s-detect").disabled = false; $("s-other").hidden = true; err("s0-err", ""); active = -1; renderList(); };
$("s-uni").onfocus = () => { if (!uni) renderList(); };
$("s-uni").onblur = closeList;
$("s-uni").onkeydown = (e) => {
  if (e.key === "Escape") { closeList(); return; }
  if (!["ArrowDown", "ArrowUp", "Enter"].includes(e.key) || (e.key === "Enter" && uni)) return;
  e.preventDefault();
  // Several matches and none chosen with the arrow keys: the list stays open to click one
  // (Enter took the first, the "(staff)" entry of a split university).
  if (e.key === "Enter") { const found = renderList(); if (active < 0 && found.length > 2) return; pick(found[Math.max(active, 0)]); return; }
  active += e.key === "ArrowDown" ? 1 : -1;
  if (active < 0) active = 0;
  renderList();
};

async function detect(group) {
  const host = $("s-host").value.trim(), seq = ++detectSeq;
  if (!host) { err("s0-err", t("setup.enter_address")); return; }
  err("s0-err", "");
  $("s-detect").disabled = true;
  const r = await send("/api/detect", {host, group});
  if (seq !== detectSeq) return;
  $("s-detect").disabled = false;
  const d = r.data;
  $("s-mfa-row").hidden = false;
  if (!d || !d.ok) { err("s0-err", errText(r)); return; }
  if (d.error) { err("s0-err", tr(d.error, d.error_t)); return; }
  $("s-group").replaceChildren(...d.groups.map((g) => new Option(g, g, false, g === d.group)));
  $("s-group-row").hidden = d.groups.length < 2;
  // No way on with this group: Next asks again, another group may do without a web page.
  if (d.saml) { $("s-mfa-row").hidden = true; err("s0-err", t("setup.saml")); return; }
  $("s-mfa").value = d.suggestion.mfa;
  numberSteps();
}
// Another address (a typo fixed, a new gateway): Next asks it for its groups and second factor.
$("s-host").oninput = () => { detectSeq++; $("s-detect").disabled = false; $("s-mfa-row").hidden = $("s-group-row").hidden = true; };
$("s-detect").onclick = () => detect("");
$("s-group").onchange = () => detect($("s-group").value);
$("s-mfa").onchange = numberSteps;

// For "Not listed": what goes into config.toml besides the university.
function profileOverrides() {
  if (!uni || uni.id !== "other") return {};
  const [host, ...path] = $("s-host").value.trim().replace(/^https?:\/\//i, "").split("/");
  const p = {host, mfa: $("s-mfa").value};
  if (path.join("/")) p.usergroup = path.join("/");
  if (!$("s-group-row").hidden && $("s-group").value) p.authgroup = $("s-group").value;
  return p;
}

$("step0").onsubmit = (e) => {
  e.preventDefault();
  if (!uni) { err("s0-err", t("setup.choose")); return; }
  if (uni.mfa === "saml") { err("s0-err", t("setup.saml")); return; }
  if (uni.id === "other" && !$("s-host").value.trim()) { err("s0-err", t("setup.enter_address")); return; }
  if (uni.id === "other" && $("s-mfa-row").hidden) { detect(""); return; }
  err("s0-err", "");
  step("step1");
};

$("step1").onsubmit = (e) => {
  e.preventDefault();
  const user = $("s-user").value.trim();
  if (!USER_RE.test(user)) { err("s1-err", t("setup.enter_user")); return; }
  if (!$("s-pw").value) { err("s1-err", t("setup.enter_password")); return; }
  err("s1-err", "");
  if (!keyRead) slide = 0;
  if (needsTotp()) step(autoOK() ? "step2a" : "step2"); else submitSetup();
};

// --- second factor, the short way --------------------------------------------------------
// A code from the user's app; the core signs in with it and adds its own code generator in the
// MFA portal (status.json "enroll"). Only the Go core does this, the Python one has no "enroll".
let autoRunning = false, autoSending = false, autoSentAt = 0, autoStage = "", autoPending = "", autoRepair = false;
function autoOK() { return !!uni && uni.mfa_enroll === "linotp" && !!S && "enroll" in S; }

function renderAuto(error) {
  const e = autoRunning && S && S.enroll;
  // Until the status catches up with the request just sent, what the request started.
  const stage = autoRunning && Date.now() - autoSentAt < 1500 ? autoPending : e ? e.stage : "";
  const busy = autoSending || stage === "connecting" || stage === "working";
  const stuck = stage === "connecting" && ["offline", "blocked", "error"].includes(S.state);
  $("a-text").textContent = stage === "code" ? tr(e.error, e.error_t) : stuck ? tr(S.message, S.message_t)
    : busy ? t(stage === "working" ? "setup.auto_working" : "setup.waiting") : t("setup.auto_sub");
  $("a-field").hidden = $("a-next").hidden = busy;
  $("a-busy").hidden = !busy;
  $("a-fix").hidden = busy || fixAction() !== "repair";
  $("a-fix").disabled = !!S.repairing;  // a Repair left running on another page may be over by now
  $("a-download").hidden = busy || S.message_id !== "reinstall_needed";
  if (error !== undefined) err("a-err", error);
  $("step2a").querySelector(".step").hidden = changingTotp;
  // A new question: an empty field, ready for the next code.
  if (stage !== autoStage && stage === "code") { $("a-code").value = ""; $("a-code").focus(); }
  autoStage = stage;
}

function autoProgress() {
  if (!autoRunning && !autoSending && !$("step2a").hidden) {
    // A Repair may end at any time: the buttons follow the service. After a Repair here, how it
    // goes is said here too (repairing, failed, download again).
    if (autoRepair) err("a-err", QUIET.includes(S.message_id) ? "" : tr(S.message, S.message_t));
    $("a-fix").hidden = fixAction() !== "repair";
    $("a-fix").disabled = !!S.repairing;
    $("a-download").hidden = S.message_id !== "reinstall_needed";
  }
  if (!autoRunning || $("step2a").hidden) return;
  const e = S.enroll, settled = Date.now() - autoSentAt > 1500;
  if (settled && (!e || e.stage === "failed")) {
    autoRunning = false;
    // A refused password: back to it like setupProgress, another code would not help.
    if (e && S.error_kind === "password" && !changingTotp) { step("step1", "s-pw"); err("s1-err", tr(e.error, e.error_t)); return; }
    // No run at all: the service started again meanwhile, the code is used up (like the iPhone).
    renderAuto(e ? tr(e.error, e.error_t) : t("enroll.failed"));
    $("a-code").focus();
    return;
  }
  if (settled && e.stage === "done") {
    autoRunning = false;
    if (changing) endChange(); else finish();
    return;
  }
  renderAuto();
}

$("step2a").onsubmit = async (e) => {
  e.preventDefault();
  if (submitting) return;
  // What this code brings is said now, not the Repair's outcome; a Repair still running goes on
  // being followed (its end restarts the service and ends this code's run too).
  if (!S.repairing) autoRepair = false;
  const code = $("a-code").value.replace(/\s/g, "");
  if (!/^[0-9]{6,8}$/.test(code)) { err("a-err", t("enroll.enter_code")); return; }
  const answer = autoRunning && S.enroll && S.enroll.stage === "code";
  // Sent: the core marks the setup done just before it answers, a poll in between must not take
  // the page to the main screen (like submitSetup).
  submitting = autoSending = setupSent = true;
  renderAuto("");
  let r;
  try {
    r = answer || changingTotp ? await post("/api/totp/auto", {code})
      : await post("/api/setup", {user: $("s-user").value.trim(), password: $("s-pw").value, code,
                                  university: uni.id, profile: profileOverrides()});
  } catch (e) {
    r = {ok: false, data: null, text: t("msg.not_running")};
  } finally {
    submitting = autoSending = false;
  }
  if (!r.ok) {
    const field = r.data && r.data.field, text = errText(r);
    if (PROFILE_FIELDS.includes(field)) { step("step0"); err("s0-err", text); return; }
    if (field === "user" || field === "password") { step("step1", field === "password" ? "s-pw" : "s-user"); err("s1-err", text); return; }
    renderAuto(text);
    return;
  }
  setupSent = autoRunning = true;
  autoSentAt = Date.now();
  autoPending = answer || (changing && S.state === "connected") ? "working" : "connecting";
  $("a-code").value = "";
  renderAuto();
};

async function stopAuto() {
  if (!autoRunning) return;
  autoRunning = false;
  await send("/api/totp/auto", {cancel: true});
}
$("a-back").onclick = async () => {
  if (submitting) return;
  await stopAuto();
  err("a-err", "");
  if (changingTotp) endChange(); else step("step1");
};
for (const id of ["a-fix", "s3-fix"]) {
  $(id).onclick = async () => {
    if (id === "a-fix") autoRepair = true;
    press($(id));
    await send("/api/repair");  // like the main screen's Repair button
    $(id).disabled = false;
    refresh();
  };
}
$("a-guide").onclick = async () => {
  if (submitting) return;
  await stopAuto();
  err("a-err", "");
  slide = 0;
  step("step2");
};

// --- second factor: the picture guide ---------------------------------------------------
// Steps come from the university (uni.<id>.mfa.<n> translated, a picture each) or are the
// generic ones. Markers in a step: {portal} links the MFA portal, {shot} is this system's
// screenshot keys, {secret} takes the QR code picture, {code} shows the check code.
let guide = [], slide = 0, keyRead = false, portalAway = false, portalSeq = 0, changingTotp = false;
const SHOT_KEYS = /Mac/.test(navigator.platform) ? "⇧⌘4" : /Win/.test(navigator.platform) ? "Win+Shift+S" : "PrtSc";
// The Linux app window (WebKitGTK) gives pages no pasted or dropped files. Browsers do, also on
// Linux (the page opens in one when the app window can't): its file field there takes no text.
const LINUX = /Linux/.test(navigator.platform) && /\bUniVPN\b/.test(navigator.userAgent);
const GENERIC = [1, 2, 3].map((n) => ({key: "setup.generic_step." + n, picture: `generic-${n}.svg`}));

function guideSteps() {
  const own = uni && uni.mfa_steps && uni.mfa_steps.length ? uni.mfa_steps : [];
  const cat = L.catalogs[lang] || {};
  const steps = own.map((text, i) => ({text: cat[`uni.${uni.id}.mfa.${i + 1}`] ?? text, picture: (uni.mfa_pictures || [])[i] || ""}));
  // Without its own QR code step a university gets the generic ones after its steps.
  const generic = GENERIC.map((g) => ({text: t(g.key), picture: g.picture}));
  if (!steps.length) return generic;
  return steps.some((g) => g.text.includes("{secret}")) ? steps : [...steps, ...generic.slice(1)];
}
function secretAt() { return Math.max(0, guide.findIndex((g) => g.text.includes("{secret}"))); }

function renderGuide() {
  guide = guideSteps();
  slide = Math.max(0, Math.min(slide, guide.length - 1));
  const g = guide[slide], el = $("g-text");
  $("g-shot").hidden = !g.picture;
  if (g.picture && !$("g-shot").src.endsWith("/guides/" + g.picture)) $("g-shot").src = "/guides/" + g.picture;
  const [before, after] = g.text.replace(/\{(secret|code)\}/g, "").replaceAll("{shot}", SHOT_KEYS).split("{portal}");
  el.replaceChildren(before);
  if (after !== undefined) {
    const url = uni && uni.mfa_portal_url;
    const a = document.createElement(url ? "a" : "span");
    if (url) Object.assign(a, {href: url, target: "_blank", rel: "noopener"});
    a.textContent = t("setup.mfa_portal");
    el.append(a, after);
  }
  $("g-away").hidden = !(portalAway && g.text.includes("{portal}"));
  $("g-drop").hidden = !g.text.includes("{secret}");
  $("g-drop").classList.toggle("done", keyRead);
  $("g-drop-text").textContent = t(keyRead ? "setup.qr_read" : "setup.drop");
  $("s-code").hidden = !(keyRead && g.text.includes("{code}"));
  $("g-dots").replaceChildren(...guide.map((_, i) => { const d = document.createElement("i"); if (i === slide) d.className = "on"; return d; }));
  $("step2").querySelector(".step").hidden = changingTotp;
  const next = $("step2").querySelector("[type=submit]"), last = slide === guide.length - 1;
  const had = document.activeElement === next;
  next.disabled = slide >= secretAt() && !keyRead;
  // Disabled with the focus (Enter on Next to the picture slide): on to the drop zone instead.
  if (had && next.disabled) ($("g-drop").hidden ? $("step2").querySelector("h2") : $("g-drop")).focus();
  next.textContent = t(last && changingTotp ? "app.save" : "app.next");
}

// Most portals only open on the university's network: say so before the user runs into it.
async function checkPortal() {
  const seq = ++portalSeq;
  portalAway = false;
  if (!uni || !uni.mfa_portal_url || uni.id === "other") return;
  const r = await send("/api/portal-check", {university: uni.id});
  if (seq !== portalSeq || !r.ok) return;
  portalAway = !r.data.reachable;
  if (!$("step2").hidden) renderGuide();
}

$("g-back").onclick = () => {
  if (submitting) return;
  if (slide > 0) { slide--; renderGuide(); return; }
  if (autoOK()) step("step2a"); else if (changingTotp) endChange(); else { setupDone = false; step("step1"); }
};

$("step2").onsubmit = async (e) => {
  e.preventDefault();
  if (slide < guide.length - 1) { slide++; renderGuide(); return; }
  if (!keyRead) { slide = secretAt(); renderGuide(); return; }
  if (!changingTotp) { submitSetup(); return; }
  const r = await send("/api/totp", {secret: $("s-totp").value.trim()});
  if (!r.ok) { err("s2-err", errText(r)); return; }
  endChange();
};

let checkSeq = 0;
// refresh: the next code for the key in use, nothing else changes. keep: the key read before,
// when trying again.
async function useKey(secret, refresh, keep) {
  const seq = ++checkSeq;
  secret = secret.trim();
  clearInterval(codeTimer);
  const previous = keep ?? (keyRead ? $("s-totp").value : "");
  if (!refresh) {
    keyRead = false;
    $("s-totp").value = secret;
    renderGuide();
  }
  if (!secret) return;
  let r;
  try { r = await post("/api/totp/check", {secret, mfa: mfa()}); } catch (e) { r = null; }
  if (seq !== checkSeq) return;
  if (!r) {
    // No answer: the core is restarting for an update (the banner says so). The same key again
    // in a moment, not a tight loop; a paste or picture is not lost.
    setTimeout(() => { if (seq === checkSeq && guideOpen()) useKey(secret, refresh, previous); }, 3000);
    return;
  }
  if (!r.ok) {
    // Refused. The key in use (the sign-in mode changed since it was read, see mfa()) is read
    // again; a stray paste keeps the key that was already read.
    keyRead = !refresh && !!previous;
    $("s-totp").value = keyRead ? previous : "";
    err("s2-err", errText(r));
    if (refresh) slide = secretAt();
    renderGuide();
    if (keyRead) useKey(previous, true);
    return;
  }
  showCode(r.data.code, r.data.remaining, secret);
  if (refresh) return;
  err("s2-err", "");
  keyRead = true;
  // Like an authenticator app after a scan: a moment to see it worked, then on to the test.
  const at = secretAt();
  if (slide < at) slide = at;
  renderGuide();
  if (slide === at && at < guide.length - 1) {
    setTimeout(() => { if (keyRead && slide === at && guideOpen()) { slide++; renderGuide(); } }, 700);
  }
}

async function readPicture(blob) {
  if (!blob) return;
  err("s2-err", "");
  let r;
  try {
    const res = await fetch("/api/totp/qr", {method: "POST", headers: {"X-Uni-VPN": "1", "Content-Type": blob.type || "application/octet-stream"}, body: blob});
    const text = await res.text();
    let data = null;
    try { data = JSON.parse(text); } catch (e) { /* plain text error */ }
    // 413: too large; 404: a core that reads no pictures (the Python one). Pasting the text works.
    r = {ok: res.ok, data, text: res.status === 413 ? t("totp.not_picture") : res.status === 404 ? t("setup.drop_help") : text};
  } catch (e) {
    r = {ok: false, data: null, text: t("msg.not_running")};
  }
  if (!r.ok) { err("s2-err", errText(r)); return; }
  useKey(r.data.secret);
}

$("g-choose").onclick = () => $("g-file").click();
$("g-file").onchange = () => { readPicture($("g-file").files[0]); $("g-file").value = ""; };
// Keys on the zone itself; its buttons (Choose picture, the help) do their own.
$("g-drop").onkeydown = (e) => { if (e.target === e.currentTarget && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); $("g-file").click(); } };
// A picture or the key's text, pasted anywhere in the guide.
document.addEventListener("paste", async (e) => {
  if (!guideOpen() || !e.clipboardData) return;
  const file = [...e.clipboardData.items].find((i) => i.kind === "file" && i.type.startsWith("image/"));
  const text = e.clipboardData.getData("text/plain");
  if (file || text.trim()) {
    e.preventDefault();
    if (file) readPicture(file.getAsFile()); else useKey(text);
    return;
  }
  // The Linux app window leaves a pasted picture out of clipboardData; during the paste the
  // clipboard itself still hands it over.
  if (!LINUX) return;
  try {
    for (const item of await navigator.clipboard.read()) {
      const type = item.types.find((t) => t.startsWith("image/"));
      if (type) { readPicture(await item.getType(type)); return; }
    }
  } catch (err) { /* nothing to read */ }
});
// Dropped files must never open in the window in place of the app; text drops elsewhere (the
// websites list) stay as they are.
for (const type of ["dragover", "drop"]) {
  document.addEventListener(type, (e) => {
    // The Linux app window gives pages no dropped files: the file field over the drop zone
    // takes them. Dropped text still goes to the page.
    if (LINUX && e.target === $("g-file")) {
      $("g-drop").classList.toggle("over", type === "dragover");
      if (type === "dragover" || !e.dataTransfer || !e.dataTransfer.getData("text/plain")) return;
    }
    const over = guideOpen();
    const files = e.dataTransfer && [...e.dataTransfer.types].includes("Files");
    if (!over && !files) return;
    e.preventDefault();
    $("g-drop").classList.toggle("over", over && type === "dragover");
    if (type === "drop" && over && e.dataTransfer) {
      const file = [...e.dataTransfer.files].find((f) => f.type.startsWith("image/"));
      if (file) readPicture(file); else if (e.dataTransfer.getData("text/plain")) useKey(e.dataTransfer.getData("text/plain"));
    }
  });
}
document.addEventListener("dragleave", (e) => { if (!e.relatedTarget) $("g-drop").classList.remove("over"); });

// The guide on screen: step2 stays unhidden when the page leaves setup without step() (set up
// in another window, the back arrow of a change).
function guideOpen() { return view === "setup" && !$("step2").hidden; }

function showCode(code, remaining, secret) {
  $("s-code").querySelector("b").textContent = code.slice(0, code.length / 2) + " " + code.slice(code.length / 2); // 123 456, 1234 5678
  const fg = $("s-code").querySelector(".fg");
  let left = remaining;
  const tick = () => {
    fg.style.strokeDashoffset = String(62.8 * (1 - left / 30));
    // A new code only while the guide is open: each check marks its window as used (MFA portal).
    if (left-- <= 0) { clearInterval(codeTimer); if (guideOpen() && $("s-totp").value.trim() === secret) useKey(secret, true); }
  };
  tick();
  codeTimer = setInterval(tick, 1000);
}


const PROFILE_FIELDS = ["university", "host", "usergroup", "authgroup", "mfa"];
async function submitSetup() {
  if (submitting) return;
  submitting = setupSent = true;
  clearInterval(codeTimer);
  step("step3");
  $("s3-msg").textContent = t("setup.waiting");
  $("s3-skip").hidden = $("s3-fix").hidden = $("s3-download").hidden = true;
  let r;
  try {
    r = await post("/api/setup", {user: $("s-user").value.trim(), password: $("s-pw").value,
                                  secret: needsTotp() ? $("s-totp").value.trim() : "", university: uni.id,
                                  profile: profileOverrides()});
  } catch (e) {
    r = {ok: false, data: null, text: t("msg.not_running")};
  } finally {
    submitting = false;
  }
  if (!r.ok) {
    const field = r.data && r.data.field, text = errText(r);
    if (PROFILE_FIELDS.includes(field)) {
      step("step0");
      err("s0-err", text);
    } else if (field === "totp" && needsTotp()) {
      slide = secretAt();
      step("step2");
      err("s2-err", text);
    } else {
      step("step1", field === "password" ? "s-pw" : "s-user");
      err("s1-err", text);
    }
    return;
  }
  setupDone = true;
  connectRequested = Date.now();
}

function setupProgress() {
  if (!setupDone || $("step3").hidden) return;
  if (S.state === "connected") { if (changing) endChange(); else finish(); return; }
  const settled = Date.now() - connectRequested > 1500;
  if (["auth_failed", "keyring"].includes(S.state) && settled) {
    const totp = S.error_kind === "totp";
    setupDone = false;
    if (totp) slide = secretAt();
    step(totp ? "step2" : "step1", totp ? null : "s-pw");
    err(totp ? "s2-err" : "s1-err", tr(S.message, S.message_t));
    return;
  }
  if (S.state === "idle" && !S.busy && settled) {
    // Nothing is trying any more (the service restarted, for example): try again.
    connectRequested = Date.now();
    post("/api/connect").catch(() => {});
  }
  const stuck = ["offline", "blocked", "error"].includes(S.state);
  const waiting = S.message_id === "waiting_for_code";
  $("s3-msg").textContent = stuck || waiting ? tr(S.message, S.message_t) : t("setup.waiting");
  $("s3-skip").hidden = !stuck;
  // "Click Repair": the button is here too, not only on the main screen.
  $("s3-fix").hidden = !stuck || fixAction() !== "repair";
  $("s3-fix").disabled = !!S.repairing;
  $("s3-download").hidden = !stuck || S.message_id !== "reinstall_needed";
}

for (const b of document.querySelectorAll("[data-back]")) b.onclick = () => { if (!submitting) { setupDone = false; step(b.dataset.back); } };
$("s3-back").onclick = () => { if (!submitting) { setupDone = false; step(needsTotp() ? autoOK() ? "step2a" : "step2" : "step1"); } };
// Without default domains nothing goes through the university yet: say where to add them.
function finish() {
  $("s4-msg").textContent = t((S.domains || []).length ? "setup.all_set_sub" : "setup.all_set_no_domains");
  step("step4");
}
$("s3-skip").onclick = () => { if (setupDone) { if (changing) endChange(); else finish(); } };
$("s4-done").onclick = () => { show("main"); render(); refresh(); };

// --- main and settings -----------------------------------------------------
$("toggle").onclick = async () => {
  const on = isOn();
  press($("toggle"));
  try { await post(on ? "/api/disconnect" : "/api/connect"); } catch (e) { /* the banner says it */ }
  refresh();
};
$("fix").onclick = async () => {
  if (fixAction() === "repair") {
    press($("fix"));
    await send("/api/repair");  // the status says how it goes
    refresh();
    return;
  }
  if (S.action === "totp") { startChange("step2"); return; }
  openSettings();  // without an earlier "Saved" or websites note
  const d = $("d-pw");
  d.open = true;
  d.querySelector("input").focus();
};
function openSettings() {
  domainsShown = false;
  $("pwmsg").textContent = $("dommsg").textContent = "";
  removeError = null;
  show("settings");
  render();
  syncNow();
}
// Like Chrome sync: opening Settings picks up changes from the other devices (and finds the
// sync keys when the keyring did not answer before).
function syncNow() {
  if (S.sync && S.sync.available) send("/api/sync/refresh").then(() => refresh());
}
$("open-settings").onclick = openSettings;
// An otpauth:// link the app was opened with (the MFA portal's "follow this link", see the
// native shells): its key goes into the guide, which then shows the test code.
let offeredKey = "";
function catchKey() {
  const m = /^#otpauth=(.*)$/.exec(location.hash);
  if (!m) return false;
  try { offeredKey = decodeURIComponent(m[1]); } catch (e) { offeredKey = ""; }
  history.replaceState(null, "", location.pathname + location.search);
  return true;
}
catchKey();
async function useOffered() {
  if (!offeredKey || !S || submitting) return;
  if (view === "setup") {
    // Before the second factor step the key waits for it (step()).
    if ($("step2").hidden && $("step2a").hidden) return;
    await stopAuto();
    step("step2");
    return;
  }
  if (S.setup_needed || view === "pair") return;
  await startChange("step2");
}

window.addEventListener("hashchange", () => {
  if (catchKey()) { useOffered(); return; }
  const target = location.hash.slice(1);
  if (!S) return;  // the first status opens it (refresh)
  // Taken, also when ignored below: the menu's next "Open" or "Settings" is a change again.
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);
  if (S.setup_needed || !["main", "settings"].includes(target)) return;
  // The tray's "Open" during the short way, or while the first setup is sent or tests the
  // connection: stay on it ("All set" comes next and says to reopen the browser).
  if (view === "setup" && (autoRunning || (!changing && (submitting || !$("step3").hidden)))) return;
  // Ended here: Settings stays when it says to restart the browser (else the note is never seen).
  if (changing && !submitting) { endChange(); if (target === "settings" || $("dommsg").textContent) return; }
  if (changing) return;
  if (view === "pair") {
    // "Devices linked" during the first setup: its Done comes first, "All set" says to reopen the browser.
    if (!$("pair-done").hidden && pairFrom === "setup") { closePair(); return; }
    if (pairShown) { pairShown = null; send("/api/sync/cancel"); }  // the code leaves the screen, as with Back
  }
  // Already open: an unsaved edit of the websites stays, the other devices' changes still come.
  if (target === "settings") { if (view !== "settings") openSettings(); else { removeError = null; render(); syncNow(); } }
  else { show("main"); render(); }
});

// Account rows: the assistant again, prefilled, back to Settings when done. Role model: macOS
// System Settings (a row opens its page, the back arrow returns without saving).
async function startChange(first) {
  // Without the list the university would look "Not listed": the row waits for the core (the
  // banner says it is away).
  await loadUniversities();
  if (!UNIS) return false;
  changing = true;
  $("s-use-other").hidden = true;  // first setup only; refresh() would hide it a poll later
  changeWebsites = (S.domains || []).join("\n");
  setupDone = setupSent = false;
  for (const id of ["s0-err", "s1-err", "s2-err"]) err(id, "");
  const current = UNIS.find((u) => u.id === S.university);
  if (current) {
    pick(current);
  } else {
    // Not listed: its gateway settings as they are, or Next would set the account up without them.
    pick(OTHER);
    $("s-host").value = (S.host || "") + (S.usergroup ? "/" + S.usergroup : "");
    $("s-mfa").value = S.mfa || "none";
    $("s-mfa-row").hidden = false;
    $("s-group").replaceChildren(...(S.authgroup ? [new Option(S.authgroup, S.authgroup, true, true)] : []));
    $("s-group-row").hidden = !S.authgroup;
    numberSteps();
  }
  $("s-user").value = S.user || "";
  $("s-pw").value = $("s-totp").value = "";
  keyRead = false;
  slide = 0;
  checkSeq++;
  $("cancel-change").hidden = false;
  changingTotp = first === "step2";
  autoRunning = false;
  err("a-err", "");
  show("setup");
  // A university that now signs in only through a web page: its first step says so (pick).
  step(uni.mfa === "saml" && !changingTotp ? "step0" : changingTotp && autoOK() ? "step2a" : first);
  return true;
}
async function resumeAuto() {
  if (!await startChange("step2")) return;
  autoRunning = setupSent = true;
  autoSentAt = 0;
}
function endChange() {
  const sent = setupSent && !changingTotp;  // an account went to the service (not just Back)
  stopAuto();  // the back arrow: the core must not go on with a code nobody wants any more
  changing = changingTotp = keyRead = setupDone = setupSent = false;
  clearInterval(codeTimer);
  $("s-pw").value = $("s-totp").value = "";
  $("cancel-change").hidden = true;
  openSettings();
  // Another university's websites: browsers that read the rule only at start (macOS) need a
  // restart, as after an edit of the list.
  if (sent && S.pac_refresh === "manual" && (S.domains || []).join("\n") !== changeWebsites) {
    $("d-dom").open = true;
    saved("dommsg", {ok: true}, t("app.saved_restart"));
  }
}
$("row-uni").onclick = () => startChange("step0");
$("row-user").onclick = () => startChange("step1");
// A new sign-in code: only the guide, saved on its own (role model: adding an authenticator
// in Google's or Microsoft's account security page).
$("row-totp").onclick = () => startChange("step2");
$("cancel-change").onclick = () => { if (!submitting) endChange(); };
$("close-settings").onclick = () => { show("main"); render(); };

async function send(path, body) {
  try { return await post(path, body); } catch (e) { return {ok: false, data: null, text: t("msg.not_running")}; }
}

function saved(id, r, okText) {
  $(id).className = "saved" + (r.ok ? "" : " bad");
  $(id).textContent = r.ok ? okText : errText(r);
}

$("pwform").onsubmit = async (e) => {
  e.preventDefault();
  if (!$("pw").value) { saved("pwmsg", {ok: false, data: null, text: t("setup.enter_password")}); return; }
  const r = await send("/api/password", {password: $("pw").value});
  saved("pwmsg", r, t("app.saved"));
  if (r.ok) $("pw").value = "";
  refresh();
};
$("auto-update").onchange = async () => {
  const box = $("auto-update"), focused = document.activeElement === box;
  autoUpdateSaving = true;
  box.disabled = true;
  const r = await send("/api/auto-update", {enabled: box.checked});
  if (!r.ok) box.checked = !box.checked;
  box.disabled = false;
  if (focused) box.focus();
  autoUpdateSaving = false;
  refresh();
};
$("language").onchange = async () => {
  const box = $("language"), previous = S ? S.language || "" : "", focused = document.activeElement === box;
  languageSaving = true;
  box.disabled = true;
  applyLanguage(box.value);  // at once, like Mullvad; the service keeps it for next time
  const r = await send("/api/language", {language: box.value});
  if (!r.ok) { box.value = previous; applyLanguage(previous); }
  box.disabled = false;
  if (focused) box.focus();  // disabling dropped the focus: arrow keys go on choosing
  languageSaving = false;
  refresh();
};
$("domform").onsubmit = async (e) => {
  e.preventDefault();
  let text = $("domains").value;
  // Changed elsewhere while being edited (a sync round): what the other device added or removed
  // stays added or removed, next to this edit.
  const now = S.domains || [], before = domainsBase.split("\n").filter(Boolean);
  if (now.join("\n") !== domainsBase) {
    const lines = text.split("\n").filter((l) => !(before.includes(l.trim()) && !now.includes(l.trim())));
    text = [...lines, ...now.filter((d) => !before.includes(d) && !lines.some((l) => l.trim() === d))].join("\n");
  }
  const r = await send("/api/domains", {text});
  if (r.ok) $("domains").value = domainsBase = r.data.domains.join("\n");
  saved("dommsg", r, t(S && S.pac_refresh === "manual" ? "app.saved_restart" : "app.saved"));
  refresh();
};

// --- devices ---------------------------------------------------------------
function renderDevices() {
  const sync = S.sync;
  $("devices-group").hidden = !(sync && sync.available);
  if ($("devices-group").hidden) return;
  // Why the last sync or Remove did not go through, like Chrome's sync error under the account.
  // A failed Remove until a later round goes through (the error it left is gone again).
  if (removeError && sync.error) removeSeen = true;
  else if (removeError && removeSeen) removeError = null;
  err("sync-err", (removeError && errText(removeError)) || (sync.on && sync.error ? tr("", sync.error) : ""));
  const rows = (sync.on ? sync.devices : []).map((d) => {
    const row = document.createElement("div"), name = document.createElement("span"), val = document.createElement("span");
    row.className = "item";
    name.textContent = d.name;
    val.className = "val";
    if (d.this) { const me = document.createElement("span"); me.className = "small"; me.textContent = t("sync.this"); val.append(me); }
    const remove = document.createElement("button");
    Object.assign(remove, {type: "button", className: "btn text remove", textContent: t("sync.remove")});
    remove.onclick = async () => {
      remove.disabled = true;
      removeError = null;
      const r = await send("/api/sync/remove", {device: d.id});
      // The button stays Remove for another try; the reason goes under the list, said in the
      // language shown. Without an answer the service is away, and the banner says so.
      if (!r.ok) { remove.disabled = false; removeError = r.data ? r : null; removeSeen = false; }
      refresh();
    };
    val.append(remove);
    row.append(name, val);
    return row;
  });
  const add = document.createElement("button");
  Object.assign(add, {type: "button", className: "item add", textContent: t("sync.add")});
  add.onclick = () => startPair("offer", "settings");
  const key = JSON.stringify([sync.on, sync.devices, lang, localesLoaded]);
  if ($("devices").dataset.key !== key) { $("devices").replaceChildren(...rows, add); $("devices").dataset.key = key; }
}

// --- linking a device: one shows a code, the other scans or types it -----------------------
let pairFrom = "settings", pairShown = null, pairListed = false;

function pairPart(id) { for (const p of ["pair-show", "pair-entry", "pair-done"]) $(p).hidden = p !== id; }

async function startPair(mode, from) {
  pairFrom = from;
  pairShown = null;
  err("pair-err", "");
  $("pair-title").textContent = t(mode === "offer" ? "sync.add" : "sync.use_other");
  $("pair-sub").textContent = t(mode === "offer" ? "sync.show_offer" : "sync.show_request");
  $("pair-qr").replaceChildren();
  $("pair-qr").hidden = $("pair-sub").hidden = true;  // no empty white box before the code comes
  $("pair-code").textContent = "\u00a0";
  $("pair-new").hidden = true;
  $("pair-new").dataset.mode = mode;
  $("pair-input").value = "";
  pairPart("pair-show");
  show("pair");
  const r = await send("/api/sync/" + mode);
  if (view !== "pair") { if (r.ok) send("/api/sync/cancel"); return; }  // closed meanwhile
  if (!r.ok) { err("pair-err", errText(r)); $("pair-new").hidden = false; return; }
  showPairing(r.data.pairing);
}

function showPairing(p) {
  pairShown = p.code;
  pairListed = false;
  // The service draws the QR code itself; nothing loads from elsewhere.
  $("pair-qr").innerHTML = p.qr;
  $("pair-qr").hidden = $("pair-sub").hidden = false;
  $("pair-code").textContent = p.code;
}

function renderPair() {
  const p = S.sync && S.sync.pairing;
  if (!pairShown || $("pair-show").hidden) return;
  if (p && p.code === pairShown) pairListed = true;
  else {
    // Gone from the status after it was there: the service restarted and took the code with it.
    // Expired, as on the phones.
    if (pairListed) { err("pair-err", t("sync.expired")); $("pair-new").hidden = false; }
    return;
  }
  // error: linked, but some settings could not be used here; or why it failed.
  if (p.state === "done") { pairPart("pair-done"); err("pair-err", tr("", p.error)); $("pair-done").querySelector("h2").focus(); pairShown = null; }
  else if (p.state === "expired" || p.state === "failed") {
    err("pair-err", p.error ? tr("", p.error) : t(p.state === "expired" ? "sync.expired" : "sync.offline"));
    $("pair-new").hidden = false;
  }
}

function closePair() {
  // Set up from another device: back from the check mark is its Done, to "All set".
  if (!$("pair-done").hidden && pairFrom === "setup" && S && !S.setup_needed) { setupSent = true; show("setup"); finish(); return; }
  pairShown = null;
  send("/api/sync/cancel");
  if (pairFrom === "setup" && S && S.setup_needed) { show("setup"); step("step0"); } else openSettings();
}

// Pressing it must not blur the university search: the closing list would move it away.
$("s-use-other").onmousedown = (e) => e.preventDefault();
$("s-use-other").onclick = () => startPair("request", "setup");
$("close-pair").onclick = closePair;
$("pair-ok").onclick = () => {
  if (!S || S.setup_needed) { closePair(); return; }
  // Set up from another device: "All set", which says to reopen the browser, as after the assistant.
  if (pairFrom === "setup") { setupSent = true; show("setup"); finish(); return; }
  show("main"); render();
};
$("pair-new").onclick = () => startPair($("pair-new").dataset.mode, pairFrom);
$("pair-type").onclick = () => { pairShown = null; send("/api/sync/cancel"); err("pair-err", ""); pairPart("pair-entry"); $("pair-input").focus(); };
$("pair-entry").onsubmit = async (e) => {
  e.preventDefault();
  const button = $("pair-entry").querySelector("[type=submit]");
  button.disabled = true;
  const r = await send("/api/sync/enter", {code: $("pair-input").value});
  button.disabled = false;
  if (!r.ok) { err("pair-err", errText(r)); return; }
  // Linked, but some settings could not be used here: said under the check mark.
  err("pair-err", r.data && r.data.error_t ? errText(r) : "");
  pairPart("pair-done");
  refresh();
};

for (const b of document.querySelectorAll(".reveal")) {
  b.onclick = () => { const i = $(b.dataset.for); i.type = i.type === "password" ? "text" : "password"; };
}
for (const info of document.querySelectorAll(".info")) {
  const pop = info.querySelector(".pop");
  info.querySelector("button").onclick = (e) => {
    e.preventDefault(); e.stopPropagation();
    pop.hidden = !pop.hidden;
    if (pop.hidden) return;
    // Keep the popover on screen: anchored at the icon, pushed left on narrow windows.
    pop.style.left = "-12px";
    const box = pop.getBoundingClientRect(), over = box.right - (document.documentElement.clientWidth - 16);
    if (over > 0) pop.style.left = (-12 - over) + "px";
  };
}
const closePops = () => { for (const p of document.querySelectorAll(".pop")) p.hidden = true; };
document.addEventListener("click", closePops);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePops(); });

loadLocales().then(() => { applyLanguage(""); refresh(); setInterval(refresh, 1500); });
</script>
</body>
</html>
