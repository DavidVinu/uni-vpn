# Built by packaging/linux/build.sh from a staging folder (paths below are relative to it).
name: uni-vpn
arch: all
platform: linux
version: ${VERSION}
version_schema: none
release: 1
section: net
priority: optional
maintainer: David Vinu <me@davidvinu.de>
vendor: uni-vpn
homepage: https://github.com/DavidVinu/uni-vpn
license: AGPL-3.0-or-later
description: |-
  Your university's VPN, only for university websites.
  Opens the university's websites through its VPN when needed, everything else stays on the normal connection.
contents:
  - src: ./app
    dst: /usr/share/uni-vpn/app
    type: tree
  - src: ./uni-vpn-open
    dst: /usr/share/uni-vpn/uni-vpn-open
    file_info:
      mode: 0755
  - src: ./uni-vpn.desktop
    dst: /usr/share/applications/uni-vpn.desktop
  - src: ./de.davidvinu.uni_vpn.metainfo.xml
    dst: /usr/share/metainfo/de.davidvinu.uni_vpn.metainfo.xml
overrides:
  deb:
    depends:
      - python3 (>= 3.11) | python3.11
      - openconnect
      - ocproxy
      - libsecret-tools
  rpm:
    depends:
      - python3 >= 3.11
      - openconnect
      - ocproxy
      - /usr/bin/secret-tool
