# A local AnyConnect gateway for packaging/inprocess/e2e.sh, which replaces @WORK@.
auth = "plain[passwd=@WORK@/passwd]"
listen-host = 127.0.0.1
# 443: the core's reachability probe always asks port 443 of the host.
tcp-port = 443
run-as-user = nobody
run-as-group = nogroup
# Workers run as nobody and cannot enter the test's private folder.
socket-file = /run/uni-vpn-e2e-ocserv.socket
pid-file = /run/uni-vpn-e2e-ocserv.pid
server-cert = @WORK@/server.crt
server-key = @WORK@/server.key
# Containers often refuse the seccomp filter.
isolate-workers = false
max-clients = 4
max-same-clients = 0
# The test logs in with a wrong password on purpose; no ban for that.
max-ban-score = 0
auth-timeout = 240
cookie-timeout = 300
deny-roaming = false
keepalive = 32400
dpd = 90
mobile-dpd = 1800
try-mtu-discovery = false
tls-priorities = "NORMAL:%SERVER_PRECEDENCE"
cisco-client-compat = true
compression = false
device = vpns
predictable-ips = true
ipv4-network = 10.77.0.0
ipv4-netmask = 255.255.255.0
dns = 10.77.0.1
# Nothing is routed: the client only ever reaches the gateway's own address.
route = 10.77.0.0/255.255.255.0
use-occtl = false
log-level = 2
