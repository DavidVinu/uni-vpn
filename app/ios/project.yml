# The Xcode project, generated with XcodeGen (`cd app/ios && xcodegen`, docs/ios.md).
# build/ comes from packaging/ios/build-core.sh: the core as UniVPNCore.xcframework, the
# licence texts and the camera prompt in every language.
name: UniVPN
options:
  bundleIdPrefix: de.davidvinu
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    # The simulator runs ad-hoc signed builds with their entitlements, no team needed.
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
    # The one definition of the module UniVPNCore (the core's C functions) for every target;
    # the xcframework carries only the code, which the app and the tunnel link.
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/Core

targets:
  UniVPN:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      # The Control Center button's intent runs in the app's process (Control/SetVPN.swift).
      - path: Control/SetVPN.swift
      - path: build/Resources
        buildPhase: resources
      - path: build/licenses
        type: folder
        buildPhase: resources
    dependencies:
      - framework: build/UniVPNCore.xcframework
        embed: false
      - target: Tunnel
      - target: Control
      - sdk: Security.framework
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.davidvinu.univpn
        PRODUCT_NAME: UniVPN
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # What the core (Go, libopenconnect) needs from the SDK at the final link.
        OTHER_LDFLAGS: "-lresolv -lxml2 -lz -framework CoreFoundation -framework Security"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Uni VPN
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, de, fr, es, zh-Hans, zh-Hant]
        NSCameraUsageDescription: Uni VPN uses the camera to scan QR codes.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: App/UniVPN.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.de.davidvinu.univpn]
    scheme:
      testTargets: [UniVPNTests]
      gatherCoverageData: false

  Tunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Tunnel
      - path: Shared
    dependencies:
      - framework: build/UniVPNCore.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.davidvinu.univpn.tunnel
        PRODUCT_NAME: Tunnel
        OTHER_LDFLAGS: "-lresolv -lxml2 -lz -framework CoreFoundation -framework Security"
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: Uni VPN
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: Tunnel/Tunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.de.davidvinu.univpn]

  # The Control Center button needs iOS 18; on iOS 17 the app runs without it.
  Control:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Control
    dependencies:
      - sdk: NetworkExtension.framework
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.davidvinu.univpn.control
        PRODUCT_NAME: Control
    info:
      path: Control/Info.plist
      properties:
        CFBundleDisplayName: Uni VPN
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Control/Control.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.de.davidvinu.univpn]

  UniVPNTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: UniVPN
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.davidvinu.univpn.tests
        GENERATE_INFOPLIST_FILE: YES
