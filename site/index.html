  let shown = [];
  if (d.kind === "mac" || d.kind === "windows" || d.kind === "android") shown = FILES[d.kind];
  if (d.kind === "linux") {
    const pick = list => list.filter(f => !!f.arm === d.arm);
    shown = d.fedora ? [...pick(FILES.rpm), ...pick(FILES.deb)] : [...pick(FILES.deb), ...pick(FILES.rpm)];
  }
  shown.forEach(f => main.appendChild(button(f)));
  // The oldest system each file installs on (distribution.xml, minSdk): older ones only say it
  // cannot be installed, and browsers do not tell the version.
  const need = {mac: "macos", android: "droid"}[d.kind];
  if (need) {
    const p = document.createElement("p");
    p.className = "req";
    p.textContent = t(need);
    note.before(p);
  }
  if (d.kind === "mac") note.appendChild(tip("mac"));
  // The browser holds the unsigned installer back first: Edge, Chrome (and Brave) and the others
  // each in their own way.
  const ua = navigator.userAgent;
  if (d.kind === "windows") note.appendChild(tip(/Edg\//.test(ua) ? "win_edge" : /Chrome\//.test(ua) && !/OPR\//.test(ua) ? "win_chrome" : "win_dl", "win"));
  if (d.kind === "linux") note.appendChild(tip("linux"));
  if (d.kind === "android") note.appendChild(tip("android"));
  const none = {phone: "phone", android32: "droid32", cros: "cros"}[d.kind];
  if (none) note.textContent = t(none);
  if (!shown.length && !none) document.querySelector(".others h2").hidden = true;
  const list = document.getElementById("list");
  ALL.filter(f => !shown.includes(f)).forEach(f => {
    const a = document.createElement("a");
    a.href = BASE + f.file;
    a.innerHTML = "<span></span><span class='file'></span>";
    a.firstChild.textContent = label(f);
    a.lastChild.textContent = f.file.split(".").pop();
    list.appendChild(a);
  });
});
</script>
</body>
</html>
